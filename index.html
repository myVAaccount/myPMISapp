            </div>
            <button className="btn" style={{width:'100%', justifyContent:'center'}} onClick={()=>onNavigate('workforce')}>
              📅 Go to Daily Attendance & Log Shift →
            </button>
          </div>
        </div>
      ) : (
        <div className="grid-3" style={{marginBottom: 20}}>
          <div className="panel" style={{marginBottom:0}}>
            <div className="panel-head">
              <div>
                <div className="panel-title">Cost & Schedule Breakdown</div>
                <div className="panel-sub">Committed / In-Transit / Installed by Cost Code</div>
              </div>
            </div>
            <div className="chart-wrap"><canvas ref={chartRef}></canvas></div>
          </div>

          <div className="panel" style={{marginBottom:0}}>
            <div className="panel-head">
              <div>
                <div className="panel-title">Spend Budget Distribution</div>
                <div className="panel-sub">Hover to inspect spend name & budget allocation</div>
              </div>
            </div>
            <div className="chart-wrap"><canvas ref={spendPieRef}></canvas></div>
          </div>

          <div className="panel" style={{marginBottom:0}}>
            <div className="panel-head">
              <div>
                <div className="panel-title">Material Staging Status</div>
                <div className="panel-sub">Hub → Port → Laydown → Installed</div>
              </div>
            </div>
            <div className="chart-wrap"><canvas ref={materialPieRef}></canvas></div>
          </div>
        </div>
      )}

      <div className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">Top Active Risks</div>
            <div className="panel-sub">Auto-generated on each sync, ranked by severity</div>
          </div>
        </div>
        {alerts.length === 0 ? (
          <div className="empty-state">No active risk flags. Site conditions nominal.</div>
        ) : (
          alerts.slice(0,8).map((a,i)=>(
            <div className={"alert-row clickable " + a.severity} key={i} onClick={()=> {
              if(isWorker){
                onNavigate(a.module === 'workforce' ? 'workforce' : 'earlywarning');
              } else {
                onNavigate(a.module || 'earlywarning');
              }
            }}>
              <div className="alert-icon">{a.severity==='critical' ? '⛔' : '⚠'}</div>
              <div>
                <div className="alert-title">{a.title}</div>
                <div className="alert-detail">{a.detail}</div>
                <div className="alert-cascade">↳ {a.cascade}</div>
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

/* ---------- module: Procurement ---------- */
function Procurement({data, mutate}){
  const statusOpts = ['Ordered','Regional Hub','Provincial Port','Site Laydown','Installed'];
  const materialCols = [
    {key:'name', label:'Item', field:{required:true}},
    {key:'supplier', label:'Supplier', field:{required:true}},
    {key:'qty', label:'Qty', numeric:true, field:{type:'number', required:true}},
    {key:'unitCost', label:'Unit Cost', numeric:true, field:{type:'number', required:true}, render:r=>fmtMoney(r.unitCost)},
    {key:'supplierLeadDays', label:'Supplier Lead (d)', numeric:true, field:{type:'number', required:true}},
    {key:'transportLeadDays', label:'Transport Lead (d)', numeric:true, field:{type:'number', required:true}},
    {key:'bufferDays', label:'Buffer (d)', numeric:true, field:{type:'number', required:true}},
    {key:'needBy', label:'Need By', field:{type:'date', required:true}, render:r=>fmtDate(r.needBy)},
    {key:'mustOrderBy', label:'Must Order By', render:r=>{
      const d = addDays(r.needBy, -(Number(r.supplierLeadDays||0)+Number(r.transportLeadDays||0)+Number(r.bufferDays||0)));
      const late = d < todayISO() && r.status !== 'Installed';
      return <span style={{color: late ? '#E8A38F' : 'inherit'}}>{fmtDate(d)}</span>;
    }},
    {key:'status', label:'Status', field:{type:'select', options:statusOpts, required:true}, render:r=><span className={"badge "+slug(r.status)}>{r.status}</span>},
  ];

  const supplierCols = [
    {key:'name', label:'Supplier', field:{required:true}},
    {key:'item', label:'Item Category', field:{required:true}},
    {key:'tier', label:'Tier', field:{type:'select', options:['Primary','Backup'], required:true}, render:r=><span className={"badge "+slug(r.tier)}>{r.tier}</span>},
    {key:'avgLeadDays', label:'Avg Lead (d)', numeric:true, field:{type:'number', required:true}},
    {key:'reliabilityPct', label:'Reliability %', numeric:true, field:{type:'number', required:true}},
    {key:'route', label:'Primary Route', field:{required:true}},
  ];

  return (
    <div>
      <DataTable
        title="Materials — Lead-Time-Driven Procurement"
        sub="Must-order-by is back-calculated from need-by date minus supplier + transport lead time and buffer"
        columns={materialCols}
        rows={data.materials}
        addLabel="Material"
        onSave={(rec, isNew)=> mutate('materials', isNew ? 'insert' : 'update', rec)}
        onDelete={(id)=> mutate('materials', 'delete', id)}
      />
      <DataTable
        title="Multi-Tier Supplier Database"
        sub="Primary and backup suppliers per critical item"
        columns={supplierCols}
        rows={data.suppliers}
        addLabel="Supplier"
        onSave={(rec, isNew)=> mutate('suppliers', isNew ? 'insert' : 'update', rec)}
        onDelete={(id)=> mutate('suppliers', 'delete', id)}
      />
    </div>
  );
}

/* ---------- module: Transportation & Logistics Cost ---------- */
function Transportation({data, mutate, mutateSettings}){
  const modeOpts = ['Truck','Barge/Boat','Final-Mile'];
  const legOpts = ['Not Started','In Transit','At Checkpoint','Delivered'];
  const weatherOpts = ['None','Watch','Delayed'];

  const cols = [
    {key:'materialName', label:'Material / Cargo', field:{required:true}},
    {key:'route', label:'Route', field:{required:true}},
    {key:'mode', label:'Current Leg Mode', field:{type:'select', options:modeOpts, required:true}},
    {key:'legStatus', label:'Status', field:{type:'select', options:legOpts, required:true}, render:r=><span className={"badge "+slug(r.legStatus)}>{r.legStatus}</span>},
    {key:'expectedDate', label:'Expected', field:{type:'date', required:true}, render:r=>fmtDate(r.expectedDate)},
    {key:'actualDate', label:'Actual', field:{type:'date'}, render:r=>fmtDate(r.actualDate)},
    {key:'weatherFlag', label:'Weather', field:{type:'select', options:weatherOpts}, render:r=><span className={"badge "+slug(r.weatherFlag||'None')}>{r.weatherFlag||'None'}</span>},
    {key:'freight', label:'Freight', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.freight)},
    {key:'fuelSurcharge', label:'Fuel Surch.', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.fuelSurcharge)},
    {key:'demurrage', label:'Demurrage', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.demurrage)},
    {key:'handling', label:'Handling', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.handling)},
    {key:'insurance', label:'Insurance', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.insurance)},
    {key:'landed', label:'Landed Cost', numeric:true, render:r=>fmtMoney(Number(r.freight||0)+Number(r.fuelSurcharge||0)+Number(r.demurrage||0)+Number(r.handling||0)+Number(r.insurance||0))},
  ];

  const fuelCols = [
    {key:'date', label:'Date', field:{type:'date', required:true}, render:r=>fmtDate(r.date)},
    {key:'type', label:'Type', field:{type:'select', options:['Delivery','Consumption'], required:true}},
    {key:'liters', label:'Liters', numeric:true, field:{type:'number', required:true}},
    {key:'cost', label:'Cost', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.cost)},
    {key:'notes', label:'Notes / Equipment', field:{}},
  ];

  const consumption = data.fuel.filter(f=>f.type==='Consumption');
  const avgDaily = consumption.length ? consumption.reduce((s,f)=>s+Number(f.liters||0),0)/consumption.length : 0;
  const daysOfFuel = avgDaily>0 ? Math.round((data.settings.fuelStockLiters||0)/avgDaily) : null;

  const [fuelStockDraft, setFuelStockDraft] = useState(data.settings.fuelStockLiters);
  const [fuelAlertDraft, setFuelAlertDraft] = useState(data.settings.fuelAlertDays);
  useEffect(()=>{ setFuelStockDraft(data.settings.fuelStockLiters); },[data.settings.fuelStockLiters]);
  useEffect(()=>{ setFuelAlertDraft(data.settings.fuelAlertDays); },[data.settings.fuelAlertDays]);

  return (
    <div>
      <DataTable
        title="Multi-Modal Shipment Tracking & Cost-Per-Shipment"
        sub="Truck / barge / final-mile legs with landed-cost roll-up"
        columns={cols}
        rows={data.shipments}
        addLabel="Shipment"
        onSave={(rec, isNew)=> mutate('shipments', isNew ? 'insert' : 'update', rec)}
        onDelete={(id)=> mutate('shipments', 'delete', id)}
      />
      <div className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">Fuel Sub-Ledger</div>
            <div className="panel-sub">Current stock: <b>{(data.settings.fuelStockLiters||0).toLocaleString()} L</b> · Avg draw: {Math.round(avgDaily)} L/day · Est. runway: {daysOfFuel===null?'—':daysOfFuel+'d'}</div>
          </div>
        </div>
        <div className="settings-row" style={{marginBottom:14}}>
          <div className="field">
            <label>Current Fuel Stock (L)</label>
            <input type="number" value={fuelStockDraft}
              onChange={e=>setFuelStockDraft(e.target.value)}
              onBlur={()=>mutateSettings({...data.settings, fuelStockLiters:fuelStockDraft})}/>
          </div>
          <div className="field">
            <label>Alert threshold (days)</label>
            <input type="number" value={fuelAlertDraft}
              onChange={e=>setFuelAlertDraft(e.target.value)}
              onBlur={()=>mutateSettings({...data.settings, fuelAlertDays:fuelAlertDraft})}/>
          </div>
        </div>
        <DataTable
          title="Fuel Log"
          columns={fuelCols}
          rows={data.fuel}
          addLabel="Entry"
          onSave={(rec, isNew)=> mutate('fuel', isNew ? 'insert' : 'update', rec)}
          onDelete={(id)=> mutate('fuel', 'delete', id)}
        />
      </div>
    </div>
  );
}

/* ---------- module: Camp Bed Matrix (Workforce Sub-View) ---------- */
function CampBedMatrix({data, mutate, role}){
  const isWorker = role === 'worker';
  const beds = (data.campBeds && data.campBeds.length > 0) ? data.campBeds : DEFAULT_CAMP_BEDS;
  const [filterStatus, setFilterStatus] = useState('ALL');
  const [searchTerm, setSearchTerm] = useState('');
  const [quickModal, setQuickModal] = useState(null);
  const [quickForm, setQuickForm] = useState({
    bedId: '',
    roomId: 'MH-A',
    currentOccupant: '',
    shiftStatus: 'Mid-Roster (Active)',
    vacatingDate: '',
    nextOccupant: 'None',
    status: 'Occupied',
    notes: '',
    actionType: 'checkin',
    selectedBedId: ''
  });
  const [safetyBannerMsg, setSafetyBannerMsg] = useState(null);

  const occupiedCount = beds.filter(b => b.status === 'Occupied').length;
  const pendingCount = beds.filter(b => b.status === 'Pending Handover').length;
  const housekeepingCount = beds.filter(b => b.status === 'Housekeeping').length;
  const availableCount = beds.filter(b => b.status === 'Available').length;
  const delayedCount = beds.filter(b => b.roadDelayExt).length;

  // Road Delay Safety Extension (+24h for all outbound/pending workers)
  const handleTriggerGlobalRoadDelay = () => {
    let affectedNames = [];
    beds.forEach(b => {
      const isOutbound = b.status === 'Pending Handover' || (b.shiftStatus && b.shiftStatus.includes('Leaving Today')) || (b.vacatingDate && b.vacatingDate <= todayISO());
      if(isOutbound){
        const currentVacating = b.vacatingDate || todayISO();
        const nextVacating = addDays(currentVacating, 1);
        affectedNames.push(b.currentOccupant || b.bedId);
        mutate('campBeds', 'update', {
          ...b,
          vacatingDate: nextVacating,
          shiftStatus: 'Shift Ending (Extended +24h — Convoy Delayed)',
          roadDelayExt: true,
          notes: (b.notes ? b.notes + ' | ' : '') + 'Transport convoy delayed by muddy roads; +24h safety extension applied'
        });
      }
    });
    setSafetyBannerMsg(`🛡️ ROAD DELAY SAFETY TRIGGERED: Outbound transport delayed by muddy roads/weather. Extended vacating date by +24h for ${affectedNames.join(', ') || 'outgoing crew'} to prevent unhousing. Inbound workers held in transit staging.`);
  };

  const handleClearGlobalRoadDelay = () => {
    beds.forEach(b => {
      if(b.roadDelayExt){
        mutate('campBeds', 'update', {
          ...b,
          shiftStatus: b.currentOccupant && b.currentOccupant !== 'Vacant' ? 'Mid-Roster (Active)' : 'Ready for Assignment',
          roadDelayExt: false
        });
      }
    });
    setSafetyBannerMsg(null);
  };

  const handleExtendSingleBed = (bed) => {
    const currentVacating = bed.vacatingDate || todayISO();
    const nextVacating = addDays(currentVacating, 1);
    mutate('campBeds', 'update', {
      ...bed,
      vacatingDate: nextVacating,
      shiftStatus: 'Shift Ending (Extended +24h — Convoy Delayed)',
      roadDelayExt: true,
      notes: (bed.notes ? bed.notes + ' | ' : '') + 'Outbound bus delayed; +24h bed safety extension applied'
    });
    setSafetyBannerMsg(`🛡️ Bed ${bed.bedId} (${bed.currentOccupant}) extended by +24h to ${fmtDate(nextVacating)} due to road delay.`);
  };

  // Quick Action 1: Check-In Inbound (🔴 Occupied)
  const executeCheckIn = (bed, incomingWorker, vacatingDate) => {
    const defaultWorker = bed.nextOccupant && bed.nextOccupant !== 'None' 
      ? bed.nextOccupant.replace(/\s*\(In Transit\)/i, '') 
      : 'Inbound Technician';
    const worker = incomingWorker || defaultWorker;
    const vacating = vacatingDate || addDays(todayISO(), 14);
    mutate('campBeds', 'update', {
      ...bed,
      currentOccupant: worker,
      shiftStatus: 'Mid-Roster (Active)',
      vacatingDate: vacating,
      nextOccupant: 'None',
      status: 'Occupied',
      roadDelayExt: false,
      notes: (bed.notes ? bed.notes + ' | ' : '') + `Checked in on ${fmtDate(todayISO())}`
    });
  };

  // Quick Action 2: Send to Housekeeping (🔵 Housekeeping)
  const executeSendToHousekeeping = (bed) => {
    mutate('campBeds', 'update', {
      ...bed,
      currentOccupant: 'Vacant',
      shiftStatus: 'Maintenance / Cleaning',
      vacatingDate: null,
      status: 'Housekeeping',
      roadDelayExt: false,
      notes: 'Departed site; queued for linen change & sanitation'
    });
  };

  // Quick Action 3: Sanitation Cleared (🟢 Available)
  const executeSanitationCleared = (bed) => {
    mutate('campBeds', 'update', {
      ...bed,
      currentOccupant: 'Vacant',
      shiftStatus: 'Ready for Assignment',
      vacatingDate: null,
      status: 'Available',
      roadDelayExt: false,
      notes: 'Sanitized & inspected — ready for check-in'
    });
  };

  // Open Quick Entry Modal
  const openQuickEntryModal = (bed = null, defaultAction = 'checkin') => {
    const targetBed = bed || beds[0] || {};
    setQuickModal({ bed: targetBed, isNew: !bed });
    setQuickForm({
      bedId: targetBed.bedId || '',
      roomId: targetBed.roomId || 'MH-A',
      currentOccupant: targetBed.nextOccupant && targetBed.nextOccupant !== 'None' 
        ? targetBed.nextOccupant.replace(/\s*\(In Transit\)/i, '') 
        : (targetBed.currentOccupant === 'Vacant' ? '' : targetBed.currentOccupant || ''),
      shiftStatus: targetBed.shiftStatus || 'Mid-Roster (Active)',
      vacatingDate: targetBed.vacatingDate || addDays(todayISO(), 14),
      nextOccupant: targetBed.nextOccupant || 'None',
      status: defaultAction === 'checkin' ? 'Occupied' : defaultAction === 'housekeeping' ? 'Housekeeping' : defaultAction === 'sanitize' ? 'Available' : (targetBed.status || 'Occupied'),
      notes: targetBed.notes || '',
      actionType: defaultAction,
      selectedBedId: targetBed.id || (beds[0] ? beds[0].id : '')
    });
  };

  const handleModalSubmit = (e) => {
    e.preventDefault();
    if(!quickModal) return;

    if(quickModal.isNew){
      const newRecord = {
        roomId: quickForm.roomId || (quickForm.bedId.includes('-') ? quickForm.bedId.split('-').slice(0,2).join('-') : 'MH-A'),
        bedId: quickForm.bedId,
        currentOccupant: quickForm.currentOccupant || 'Vacant',
        shiftStatus: quickForm.shiftStatus,
        vacatingDate: quickForm.vacatingDate || null,
        nextOccupant: quickForm.nextOccupant || 'None',
        status: quickForm.status,
        roadDelayExt: false,
        notes: quickForm.notes || ''
      };
      mutate('campBeds', 'insert', newRecord);
    } else if(quickForm.actionType === 'checkin') {
      const selected = beds.find(b => b.id === quickForm.selectedBedId) || quickModal.bed;
      executeCheckIn(selected, quickForm.currentOccupant, quickForm.vacatingDate);
    } else if(quickForm.actionType === 'housekeeping') {
      const selected = beds.find(b => b.id === quickForm.selectedBedId) || quickModal.bed;
      executeSendToHousekeeping(selected);
    } else if(quickForm.actionType === 'sanitize') {
      const selected = beds.find(b => b.id === quickForm.selectedBedId) || quickModal.bed;
      executeSanitationCleared(selected);
    } else {
      // Manual full edit
      const selected = beds.find(b => b.id === quickForm.selectedBedId) || quickModal.bed;
      mutate('campBeds', 'update', {
        ...selected,
        bedId: quickForm.bedId || selected.bedId,
        roomId: quickForm.roomId || selected.roomId,
        currentOccupant: quickForm.currentOccupant || 'Vacant',
        shiftStatus: quickForm.shiftStatus,
        vacatingDate: quickForm.vacatingDate || null,
        nextOccupant: quickForm.nextOccupant || 'None',
        status: quickForm.status,
        notes: quickForm.notes
      });
    }
    setQuickModal(null);
  };

  const filteredBeds = beds.filter(b => {
    if(filterStatus !== 'ALL' && b.status !== filterStatus) return false;
    if(searchTerm){
      const term = searchTerm.toLowerCase();
      const matchBed = (b.bedId || '').toLowerCase().includes(term);
      const matchOcc = (b.currentOccupant || '').toLowerCase().includes(term);
      const matchNext = (b.nextOccupant || '').toLowerCase().includes(term);
      const matchShift = (b.shiftStatus || '').toLowerCase().includes(term);
      return matchBed || matchOcc || matchNext || matchShift;
    }
    return true;
  });

  return (
    <div>
      {/* Road Delay Safety Status Banner */}
      <div className="delay-banner">
        <div>
          <div className="delay-banner-title">
            <span>🛡️ ROAD DELAY SAFETY ENGINE</span>
            {delayedCount > 0 ? (
              <span className="badge delay-ext">⚠️ {delayedCount} Convoy Delay Extension Active</span>
            ) : (
              <span className="badge" style={{background:'#233A2C', color:'#8FCB9F'}}>Nominal Transport Corridor</span>
            )}
          </div>
          <div className="delay-banner-sub">
            {safetyBannerMsg || "Automated +24h vacating extension protects outbound workers from being unhoused if convoys encounter muddy roads or weather holds."}
          </div>
        </div>
        {!isWorker && (
          <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
            {delayedCount === 0 ? (
              <button className="btn sm" style={{background:'var(--rust)', color:'#fff'}} onClick={handleTriggerGlobalRoadDelay}>
                🌧️ Simulate Road Delay (+24h All Outbound)
              </button>
            ) : (
              <button className="btn secondary sm" onClick={handleClearGlobalRoadDelay}>
                ☀️ Clear Road Delay & Restore Normal Rotations
              </button>
            )}
          </div>
        )}
      </div>

      {/* KPI Cards for Camp Bed Turnover */}
      <div className="kpi-row" style={{marginBottom:18}}>
        <div className="kpi-card clickable" style={{padding:'12px 14px', borderTopColor:'#C4432B'}} onClick={()=>setFilterStatus('Occupied')}>
          <div className="kpi-label">🔴 Occupied Beds</div>
          <div className="kpi-value" style={{fontSize:22, color:'#E8A38F'}}>{occupiedCount}</div>
          <div className="kpi-foot">Locked by active worker</div>
        </div>
        <div className="kpi-card clickable" style={{padding:'12px 14px', borderTopColor:'var(--amber)'}} onClick={()=>setFilterStatus('Pending Handover')}>
          <div className="kpi-label">🟡 Pending Handover</div>
          <div className="kpi-value" style={{fontSize:22, color:'#E8C285'}}>{pendingCount}</div>
          <div className="kpi-foot">High-risk! Outgoing leaves today</div>
        </div>
        <div className="kpi-card clickable" style={{padding:'12px 14px', borderTopColor:'var(--steel)'}} onClick={()=>setFilterStatus('Housekeeping')}>
          <div className="kpi-label">🔵 Housekeeping</div>
          <div className="kpi-value" style={{fontSize:22, color:'#9DBBE0'}}>{housekeepingCount}</div>
          <div className="kpi-foot">Requires cleaning before check-in</div>
        </div>
        <div className="kpi-card ok clickable" style={{padding:'12px 14px'}} onClick={()=>setFilterStatus('Available')}>
          <div className="kpi-label">🟢 Available Beds</div>
          <div className="kpi-value" style={{fontSize:22, color:'#8FCB9F'}}>{availableCount}</div>
          <div className="kpi-foot">Ready for immediate assignment</div>
        </div>
      </div>

      {/* Main Panel with Filter, Search, and Action Bar */}
      <div className="panel">
        <div className="panel-head" style={{flexWrap:'wrap', gap:12}}>
          <div>
            <div className="panel-title">Camp Bed Matrix & Accommodation Allocation</div>
            <div className="panel-sub">
              Physical room allocation, shift turnover status, and anti-hot-bedding control ({beds.length} Total Beds)
            </div>
          </div>
          {!isWorker && (
            <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
              <button className="btn" onClick={()=>openQuickEntryModal(null, 'checkin')}>
                + Assign / Update Bed
              </button>
              <button className="btn secondary" onClick={()=>openQuickEntryModal(null, 'manual')}>
                + Add New Bed
              </button>
            </div>
          )}
        </div>

        {/* Filter Pills and Search */}
        <div className="filter-bar">
          <button className={"filter-chip " + (filterStatus==='ALL'?'active':'')} onClick={()=>setFilterStatus('ALL')}>
            All Beds ({beds.length})
          </button>
          <button className={"filter-chip " + (filterStatus==='Occupied'?'active':'')} onClick={()=>setFilterStatus('Occupied')}>
            🔴 Occupied ({occupiedCount})
          </button>
          <button className={"filter-chip " + (filterStatus==='Pending Handover'?'active':'')} onClick={()=>setFilterStatus('Pending Handover')}>
            🟡 Pending Handover ({pendingCount})
          </button>
          <button className={"filter-chip " + (filterStatus==='Housekeeping'?'active':'')} onClick={()=>setFilterStatus('Housekeeping')}>
            🔵 Housekeeping ({housekeepingCount})
          </button>
          <button className={"filter-chip " + (filterStatus==='Available'?'active':'')} onClick={()=>setFilterStatus('Available')}>
            🟢 Available ({availableCount})
          </button>

          <div style={{marginLeft:'auto', display:'flex', alignItems:'center', gap:8}}>
            <input
              type="text"
              placeholder="Search Bed or Occupant…"
              value={searchTerm}
              onChange={e=>setSearchTerm(e.target.value)}
              style={{
                background:'var(--bg)', border:'1px solid var(--border)', color:'var(--text)',
                padding:'5px 10px', borderRadius:6, fontSize:12, fontFamily:'var(--body)', width:180
              }}
            />
            {searchTerm && (
              <button className="icon-btn" onClick={()=>setSearchTerm('')} title="Clear Search">✕</button>
            )}
          </div>
        </div>

        {/* Data Grid Layout */}
        {filteredBeds.length === 0 ? (
          <div className="empty-state">No camp beds match the selected filter.</div>
        ) : (
          <div className="table-scroll">
            <table>
              <thead>
                <tr>
                  <th style={{width:130}}>ROOM / BED ID</th>
                  <th>CURRENT OCCUPANT</th>
                  <th>SHIFT ROTATION STATUS</th>
                  <th>VACATING DATE</th>
                  <th>NEXT RESERVED OCCUPANT</th>
                  <th>BED STATUS</th>
                  {!isWorker && <th style={{textAlign:'right'}}>QUICK ACTIONS</th>}
                </tr>
              </thead>
              <tbody>
                {filteredBeds.map(bed => {
                  const isPending = bed.status === 'Pending Handover';
                  const isOccupied = bed.status === 'Occupied';
                  const isCleaning = bed.status === 'Housekeeping';
                  const isAvail = bed.status === 'Available';

                  return (
                    <tr key={bed.id} className={bed._pending ? 'row-pending' : ''}>
                      {/* 1. ROOM / BED ID */}
                      <td className="num" style={{fontWeight:700, color:'var(--text)', fontSize:13}}>
                        <b>{bed.bedId}</b>
                      </td>

                      {/* 2. CURRENT OCCUPANT */}
                      <td>
                        {bed.currentOccupant === 'Vacant' || !bed.currentOccupant ? (
                          <span style={{color:'var(--text-dim)', fontStyle:'italic'}}>Vacant</span>
                        ) : (
                          <span style={{fontWeight:600, color:'#F3ECDF'}}>{bed.currentOccupant}</span>
                        )}
                      </td>

                      {/* 3. SHIFT ROTATION STATUS */}
                      <td>
                        <span style={{
                          fontSize:12.5,
                          color: isPending ? '#E8C285' : isCleaning ? '#9DBBE0' : isOccupied ? 'var(--text)' : 'var(--text-dim)'
                        }}>
                          {bed.shiftStatus || '—'}
                        </span>
                      </td>

                      {/* 4. VACATING DATE */}
                      <td>
                        {bed.vacatingDate ? (
                          <div style={{display:'inline-flex', alignItems:'center', flexWrap:'wrap', gap:4}}>
                            <span className="num" style={{color: bed.roadDelayExt ? '#FFA994' : isPending ? '#E8C285' : 'inherit'}}>
                              {fmtDate(bed.vacatingDate)}
                            </span>
                            {bed.roadDelayExt && (
                              <span className="badge delay-ext" title="Convoy road delay: +24h safety extension applied">
                                +24h Ext
                              </span>
                            )}
                          </div>
                        ) : (
                          <span style={{color:'var(--text-dim)'}}>—</span>
                        )}
                      </td>

                      {/* 5. NEXT RESERVED OCCUPANT */}
                      <td>
                        {bed.nextOccupant && bed.nextOccupant !== 'None' ? (
                          <span style={{color: isPending ? '#E8C285' : 'var(--text)', fontWeight: isPending ? 600 : 'normal'}}>
                            {bed.nextOccupant}
                          </span>
                        ) : (
                          <span style={{color:'var(--text-dim)'}}>None</span>
                        )}
                      </td>

                      {/* 6. BED STATUS */}
                      <td>
                        {isOccupied && <span className="badge bed-occupied">🔴 Occupied</span>}
                        {isPending && <span className="badge bed-pending" title="High-risk! Outgoing worker leaves today; incoming worker arrives today.">🟡 Pending Handover</span>}
                        {isCleaning && <span className="badge bed-housekeeping">🔵 Housekeeping</span>}
                        {isAvail && <span className="badge bed-available">🟢 Available</span>}
                      </td>

                      {/* 7. QUICK ACTIONS (Admin only) */}
                      {!isWorker && (
                        <td style={{textAlign:'right'}}>
                          <div className="row-actions" style={{justifyContent:'flex-end'}}>
                            {/* Pending Handover actions */}
                            {isPending && (
                              <>
                                <button className="btn sm secondary" title="Depart worker & send room to housekeeping"
                                  onClick={()=>executeSendToHousekeeping(bed)}>
                                  Depart → Clean (🔵)
                                </button>
                                <button className="btn sm" title="Check-in incoming worker"
                                  onClick={()=>executeCheckIn(bed)}>
                                  Check-In (🔴)
                                </button>
                              </>
                            )}

                            {/* Occupied actions */}
                            {isOccupied && (
                              <>
                                {!bed.roadDelayExt && (
                                  <button className="btn sm secondary" style={{color:'var(--amber)'}} title="Extend vacating date by +24h due to transport delay"
                                    onClick={()=>handleExtendSingleBed(bed)}>
                                    +24h Delay
                                  </button>
                                )}
                                <button className="btn sm secondary" title="Worker departed -> send room to housekeeping"
                                  onClick={()=>executeSendToHousekeeping(bed)}>
                                  Depart → Clean (🔵)
                                </button>
                              </>
                            )}

                            {/* Housekeeping action */}
                            {isCleaning && (
                              <button className="btn sm" style={{background:'var(--olive)', color:'#fff'}} title="Room sanitized and ready for new occupant"
                                onClick={()=>executeSanitationCleared(bed)}>
                                ✓ Sanitation Cleared (🟢)
                              </button>
                            )}

                            {/* Available action */}
                            {isAvail && (
                              <button className="btn sm" title="Assign inbound worker"
                                onClick={()=>openQuickEntryModal(bed, 'checkin')}>
                                Check-In Worker (🔴)
                              </button>
                            )}

                            {/* Edit icon */}
                            <button className="icon-btn" title="Edit Full Bed Details" onClick={()=>openQuickEntryModal(bed, 'manual')}>
                              ✎
                            </button>

                            {/* Delete icon */}
                            <button className="icon-btn" title="Delete Bed" onClick={()=>mutate('campBeds', 'delete', bed.id)}>
                              ✕
                            </button>
                          </div>
                        </td>
                      )}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* + Quick Entry & Bed Assignment Modal (Admin only) */}
      {!isWorker && quickModal !== null && (
        <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) setQuickModal(null); }}>
          <div className="modal" style={{maxWidth:500}}>
            <div className="modal-title">
              {quickModal.isNew ? '+ Add New Bed' : `+ Assign / Update Bed — ${quickForm.bedId || 'Bed Matrix'}`}
            </div>

            <form onSubmit={handleModalSubmit}>
              {/* Select Action Mode */}
              {!quickModal.isNew && (
                <div style={{marginBottom:16}}>
                  <label style={{display:'block', fontSize:11, color:'var(--text-dim)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.5px'}}>
                    Execute Command:
                  </label>
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                    <button type="button"
                      className={"btn sm " + (quickForm.actionType==='checkin'?'':'secondary')}
                      onClick={()=>setQuickForm({...quickForm, actionType:'checkin', status:'Occupied', shiftStatus:'Mid-Roster (Active)'})}>
                      🔴 Check-In Inbound
                    </button>
                    <button type="button"
                      className={"btn sm " + (quickForm.actionType==='housekeeping'?'':'secondary')}
                      onClick={()=>setQuickForm({...quickForm, actionType:'housekeeping', status:'Housekeeping', shiftStatus:'Maintenance / Cleaning', currentOccupant:'Vacant'})}>
                      🔵 Send to Housekeeping
                    </button>
                    <button type="button"
                      className={"btn sm " + (quickForm.actionType==='sanitize'?'':'secondary')}
                      onClick={()=>setQuickForm({...quickForm, actionType:'sanitize', status:'Available', shiftStatus:'Ready for Assignment', currentOccupant:'Vacant'})}>
                      🟢 Sanitation Cleared
                    </button>
                    <button type="button"
                      className={"btn sm " + (quickForm.actionType==='manual'?'':'secondary')}
                      onClick={()=>setQuickForm({...quickForm, actionType:'manual'})}>
                      📝 Full Details Edit
                    </button>
                  </div>
                </div>
              )}

              {/* Target Bed Selector */}
              {!quickModal.isNew && (
                <div className="field">
                  <label>Selected Bed</label>
                  <select
                    value={quickForm.selectedBedId}
                    onChange={e => {
                      const sel = beds.find(b => b.id === e.target.value);
                      if(sel){
                        setQuickForm({
                          ...quickForm,
                          selectedBedId: sel.id,
                          bedId: sel.bedId,
                          roomId: sel.roomId,
                          currentOccupant: sel.nextOccupant && sel.nextOccupant !== 'None' 
                            ? sel.nextOccupant.replace(/\s*\(In Transit\)/i, '') 
                            : (sel.currentOccupant === 'Vacant' ? '' : sel.currentOccupant || ''),
                          shiftStatus: sel.shiftStatus,
                          vacatingDate: sel.vacatingDate || addDays(todayISO(), 14),
                          nextOccupant: sel.nextOccupant,
                          status: sel.status,
                          notes: sel.notes || ''
                        });
                      }
                    }}
                  >
                    {beds.map(b => (
                      <option key={b.id} value={b.id}>
                        {b.bedId} — {b.currentOccupant} ({b.status})
                      </option>
                    ))}
                  </select>
                </div>
              )}

              {/* Check-in Form */}
              {(quickForm.actionType === 'checkin' || quickModal.isNew) && (
                <>
                  {quickModal.isNew && (
                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                      <div className="field">
                        <label>Bed ID</label>
                        <input type="text" placeholder="e.g. MH-A-05" required
                          value={quickForm.bedId} onChange={e=>setQuickForm({...quickForm, bedId:e.target.value})} />
                      </div>
                      <div className="field">
                        <label>Room / Wing</label>
                        <input type="text" placeholder="e.g. MH-A" required
                          value={quickForm.roomId} onChange={e=>setQuickForm({...quickForm, roomId:e.target.value})} />
                      </div>
                    </div>
                  )}

                  <div className="field">
                    <label>Assign Inbound Worker</label>
                    <input type="text" placeholder="e.g. Mark Santos" required
                      value={quickForm.currentOccupant} onChange={e=>setQuickForm({...quickForm, currentOccupant:e.target.value})} />
                  </div>

                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                    <div className="field">
                      <label>Vacating Date (Roster End)</label>
                      <input type="date" required
                        value={quickForm.vacatingDate} onChange={e=>setQuickForm({...quickForm, vacatingDate:e.target.value})} />
                    </div>
                    <div className="field">
                      <label>Shift Status</label>
                      <input type="text" placeholder="e.g. Mid-Roster (Active)"
                        value={quickForm.shiftStatus} onChange={e=>setQuickForm({...quickForm, shiftStatus:e.target.value})} />
                    </div>
                  </div>
                </>
              )}

              {/* Housekeeping Confirmation */}
              {quickForm.actionType === 'housekeeping' && !quickModal.isNew && (
                <div style={{background:'var(--surface2)', padding:12, borderRadius:6, marginBottom:12, border:'1px solid var(--border)'}}>
                  <div style={{fontWeight:600, color:'#9DBBE0', fontSize:13, marginBottom:4}}>
                    🔵 Send to Housekeeping & Cleaning
                  </div>
                  <div style={{fontSize:12, color:'var(--text-dim)'}}>
                    This command disconnects the departing worker ({quickForm.currentOccupant}), clears the room to Vacant, and marks status as <b>Housekeeping</b> until sanitation is signed off.
                  </div>
                </div>
              )}

              {/* Sanitation Cleared Confirmation */}
              {quickForm.actionType === 'sanitize' && !quickModal.isNew && (
                <div style={{background:'var(--surface2)', padding:12, borderRadius:6, marginBottom:12, border:'1px solid var(--border)'}}>
                  <div style={{fontWeight:600, color:'#8FCB9F', fontSize:13, marginBottom:4}}>
                    🟢 Sanitation Cleared & Ready for Occupancy
                  </div>
                  <div style={{fontSize:12, color:'var(--text-dim)'}}>
                    This command signs off housekeeping disinfection, setting status to <b>Available</b> for immediate inbound crew check-in.
                  </div>
                </div>
              )}

              {/* Manual Details Full Edit */}
              {quickForm.actionType === 'manual' && !quickModal.isNew && (
                <>
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                    <div className="field">
                      <label>Bed ID</label>
                      <input type="text" value={quickForm.bedId} onChange={e=>setQuickForm({...quickForm, bedId:e.target.value})} required />
                    </div>
                    <div className="field">
                      <label>Current Occupant</label>
                      <input type="text" value={quickForm.currentOccupant} onChange={e=>setQuickForm({...quickForm, currentOccupant:e.target.value})} />
                    </div>
                  </div>

                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                    <div className="field">
                      <label>Bed Status</label>
                      <select value={quickForm.status} onChange={e=>setQuickForm({...quickForm, status:e.target.value})}>
                        <option value="Occupied">🔴 Occupied</option>
                        <option value="Pending Handover">🟡 Pending Handover</option>
                        <option value="Housekeeping">🔵 Housekeeping</option>
                        <option value="Available">🟢 Available</option>
                      </select>
                    </div>
                    <div className="field">
                      <label>Vacating Date</label>
                      <input type="date" value={quickForm.vacatingDate || ''} onChange={e=>setQuickForm({...quickForm, vacatingDate:e.target.value})} />
                    </div>
                  </div>

                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                    <div className="field">
                      <label>Shift Rotation Status</label>
                      <input type="text" value={quickForm.shiftStatus} onChange={e=>setQuickForm({...quickForm, shiftStatus:e.target.value})} />
                    </div>
                    <div className="field">
                      <label>Next Reserved Occupant</label>
                      <input type="text" value={quickForm.nextOccupant} onChange={e=>setQuickForm({...quickForm, nextOccupant:e.target.value})} />
                    </div>
                  </div>
                </>
              )}

              <div className="field">
                <label>Notes / Logistics Reference</label>
                <input type="text" placeholder="e.g. Transport convoy seat #4, night shift operator"
                  value={quickForm.notes || ''} onChange={e=>setQuickForm({...quickForm, notes:e.target.value})} />
              </div>

              <div className="modal-actions">
                <button type="button" className="btn secondary" onClick={()=>setQuickModal(null)}>Cancel</button>
                <button type="submit" className="btn">
                  {quickForm.actionType === 'checkin' ? 'Check-In Worker' :
                   quickForm.actionType === 'housekeeping' ? 'Confirm Housekeeping' :
                   quickForm.actionType === 'sanitize' ? 'Confirm Cleared' : 'Save Bed Record'}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- module: Workforce with Attendance, Calendar & Camp Bed Matrix ---------- */
function Workforce({data, mutate, role}){
  const isWorker = role === 'worker';
  const [subTab, setSubTab] = useState('attendance');
  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [editModal, setEditModal] = useState(null);
  const [modalForm, setModalForm] = useState({status:'Present', timeIn:'07:00', timeOut:'17:00', notes:''});

  const goYesterday = () => setSelectedDate(addDays(selectedDate, -1));
  const goToday = () => setSelectedDate(todayISO());
  const goTomorrow = () => setSelectedDate(addDays(selectedDate, 1));

  const isToday = selectedDate === todayISO();
  const isYesterday = selectedDate === addDays(todayISO(), -1);
  const dateLabel = isToday ? 'Today' : isYesterday ? 'Yesterday' : fmtDate(selectedDate);

  const attendanceList = (data.attendance || []).filter(a => a.date === selectedDate);
  const attendanceMap = {};
  attendanceList.forEach(a => { attendanceMap[a.workerId] = a; });

  const calcHours = (tin, tout) => {
    if(!tin || !tout) return null;
    const [h1, m1] = tin.split(':').map(Number);
    const [h2, m2] = tout.split(':').map(Number);
    let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    if(diff < 0) diff += 24 * 60;
    return (diff / 60).toFixed(1);
  };

  const handleSaveAttendance = (workerId, workerName, updates) => {
    const existing = attendanceMap[workerId];
    const hours = calcHours(updates.timeIn, updates.timeOut) || updates.hoursWorked || 0;
    const payload = {
      workerId,
      workerName,
      date: selectedDate,
      status: updates.status || 'Present',
      timeIn: updates.timeIn ?? '07:00',
      timeOut: updates.timeOut ?? '17:00',
      hoursWorked: Number(hours),
      notes: updates.notes || ''
    };

    if(existing){
      mutate('attendance', 'update', {...existing, ...payload});
    } else {
      mutate('attendance', 'insert', payload);
    }
  };

  const markAllOnSitePresent = () => {
    data.workforce.forEach(w => {
      if(w.status === 'On Site'){
        const existing = attendanceMap[w.id];
        if(!existing || existing.status === 'Absent'){
          handleSaveAttendance(w.id, w.name, {status:'Present', timeIn:'07:00', timeOut:'17:00'});
        }
      }
    });
  };

  const presentCount = attendanceList.filter(a => a.status === 'Present').length;
  const lateCount = attendanceList.filter(a => a.status === 'Late').length;
  const absentCount = attendanceList.filter(a => a.status === 'Absent').length;
  const totalHours = attendanceList.reduce((s,a)=>s+Number(a.hoursWorked||0), 0);
  const onSiteCount = data.workforce.filter(w=>w.status==='On Site').length;

  const registryCols = [
    {key:'name', label:'Worker', field:{required:true}},
    {key:'trade', label:'Trade / Role', field:{required:true}},
    {key:'rotationIn', label:'Rotation In', field:{type:'date', required:true}, render:r=>fmtDate(r.rotationIn)},
    {key:'rotationOut', label:'Rotation Out', field:{type:'date', required:true}, render:r=>fmtDate(r.rotationOut)},
    {key:'certName', label:'Certification', field:{}},
    {key:'certExpiry', label:'Cert Expiry', field:{type:'date'}, render:r=>{
      const soon = r.certExpiry && daysBetween(todayISO(), r.certExpiry) <= (data.settings.certAlertDays||30);
      return <span style={{color: soon ? '#E8A38F':'inherit'}}>{fmtDate(r.certExpiry)}</span>;
    }},
    {key:'status', label:'Deployment Status', field:{type:'select', options:['On Site','Off Rotation'], required:true}, render:r=><span className={"badge "+slug(r.status)}>{r.status}</span>},
  ];

  const pendingHandoverCount = (data.campBeds || DEFAULT_CAMP_BEDS).filter(b => b.status === 'Pending Handover' || b.roadDelayExt).length;

  return (
    <div>
      <div className="tab-pills">
        <button className={"tab-pill " + (subTab==='attendance'?'active':'')} onClick={()=>setSubTab('attendance')}>
          📅 Daily Attendance & Time Tracking
        </button>
        <button className={"tab-pill " + (subTab==='registry'?'active':'')} onClick={()=>setSubTab('registry')}>
          👥 Worker Registry & Certifications ({data.workforce.length})
        </button>
        <button className={"tab-pill " + (subTab==='campbeds'?'active':'')} onClick={()=>setSubTab('campbeds')}>
          🛏️ Camp Bed Matrix ({(data.campBeds || DEFAULT_CAMP_BEDS).length})
          {pendingHandoverCount > 0 && (
            <span style={{marginLeft:6, background:'var(--amber)', color:'#1A1305', borderRadius:10, padding:'1px 6px', fontSize:10, fontWeight:'bold'}}>
              {pendingHandoverCount}
            </span>
          )}
        </button>
      </div>

      {subTab === 'campbeds' ? (
        <CampBedMatrix data={data} mutate={mutate} role={role} />
      ) : subTab === 'attendance' ? (
        <div>
          <div className="calendar-bar">
            <div className="date-controls">
              <button className="btn secondary sm" onClick={goYesterday} title="Previous Day">◀ Prev</button>
              <button className={"btn sm " + (isToday?'':'secondary')} onClick={goToday}>Today</button>
              <button className={"btn sm " + (isYesterday?'':'secondary')} onClick={()=>setSelectedDate(addDays(todayISO(),-1))}>Yesterday</button>
              <button className="btn secondary sm" onClick={goTomorrow} title="Next Day">Next ▶</button>
              <input type="date" className="cal-picker" value={selectedDate} onChange={e=>e.target.value && setSelectedDate(e.target.value)} />
            </div>

            <div style={{display:'flex', alignItems:'center', gap:10}}>
              <div className="date-display" style={{color:'var(--amber)'}}>
                {dateLabel} <span style={{fontSize:12.5, color:'var(--text-dim)', fontWeight:'normal'}}>({fmtDate(selectedDate)})</span>
              </div>
              <button className="btn sm" onClick={markAllOnSitePresent}>
                ✓ Mark All On-Site Present (07:00 - 17:00)
              </button>
            </div>
          </div>

          <div className="kpi-row" style={{marginBottom:18}}>
            <div className="kpi-card ok" style={{padding:'12px 14px'}}>
              <div className="kpi-label">Present</div>
              <div className="kpi-value" style={{fontSize:22, color:'#8FCB9F'}}>{presentCount} / {onSiteCount}</div>
              <div className="kpi-foot">On site workforce</div>
            </div>
            <div className="kpi-card" style={{padding:'12px 14px', borderTopColor:'var(--amber)'}}>
              <div className="kpi-label">Late / Partial</div>
              <div className="kpi-value" style={{fontSize:22, color:'#E8C285'}}>{lateCount}</div>
              <div className="kpi-foot">Adjusted hours</div>
            </div>
            <div className="kpi-card critical" style={{padding:'12px 14px'}}>
              <div className="kpi-label">Absent / Unlogged</div>
              <div className="kpi-value" style={{fontSize:22, color:'#E8A38F'}}>{Math.max(0, onSiteCount - presentCount - lateCount)}</div>
              <div className="kpi-foot">Needs attendance log</div>
            </div>
            <div className="kpi-card" style={{padding:'12px 14px', borderTopColor:'var(--steel)'}}>
              <div className="kpi-label">Total Hours Logged</div>
              <div className="kpi-value" style={{fontSize:22, color:'#9DBBE0'}}>{totalHours.toFixed(1)} hrs</div>
              <div className="kpi-foot">Man-hours for {dateLabel.toLowerCase()}</div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-head">
              <div>
                <div className="panel-title">Muster & Attendance Log — {fmtDate(selectedDate)}</div>
                <div className="panel-sub">Select date above to inspect past or current attendance</div>
              </div>
            </div>

            {data.workforce.length === 0 ? (
              <div className="empty-state">No workers in registry. Add workers in the Registry tab first.</div>
            ) : (
              <div className="table-scroll">
                <table>
                  <thead>
                    <tr>
                      <th>Worker</th>
                      <th>Trade / Role</th>
                      <th>Rotation State</th>
                      <th>Attendance Status</th>
                      <th>Time In</th>
                      <th>Time Out</th>
                      <th>Hours</th>
                      <th>Notes</th>
                      <th>Quick Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {data.workforce.map(w => {
                      const att = attendanceMap[w.id];
                      const status = att ? att.status : (w.status === 'On Site' ? 'Unlogged' : 'Off Rotation');
                      const timeIn = att ? att.timeIn : '—';
                      const timeOut = att ? att.timeOut : '—';
                      const hours = att && att.hoursWorked !== null ? `${att.hoursWorked}h` : '—';
                      const isLogged = !!att;

                      return (
                        <tr key={w.id} className={att && att._pending ? 'row-pending' : ''}>
                          <td>
                            <b>{w.name}</b>
                          </td>
                          <td>{w.trade}</td>
                          <td><span className={"badge " + slug(w.status)}>{w.status}</span></td>
                          <td>
                            <span className={"badge " + slug(status)}>
                              {status === 'Present' ? '✓ Present' : status === 'Late' ? '⏱ Late' : status === 'Absent' ? '✕ Absent' : status}
                            </span>
                          </td>
                          <td>{timeIn !== '—' ? <span className="time-badge">{timeIn}</span> : '—'}</td>
                          <td>{timeOut !== '—' ? <span className="time-badge">{timeOut}</span> : '—'}</td>
                          <td className="num">{hours}</td>
                          <td style={{color:'var(--text-dim)', fontSize:12}}>{att ? (att.notes || '—') : '—'}</td>
                          <td>
                            <div className="row-actions">
                              <button className="btn secondary sm"
                                onClick={()=>{
                                  setEditModal({worker: w, record: att || {}});
                                  setModalForm({
                                    status: att ? att.status : 'Present',
                                    timeIn: att && att.timeIn ? att.timeIn : '07:00',
                                    timeOut: att && att.timeOut ? att.timeOut : '17:00',
                                    notes: att ? att.notes : ''
                                  });
                                }}>
                                ✎ {isLogged ? 'Edit Time' : 'Log Time'}
                              </button>
                              {(!att || att.status !== 'Present') && (
                                <button className="icon-btn" title="Quick Present"
                                  onClick={()=>handleSaveAttendance(w.id, w.name, {status:'Present', timeIn:'07:00', timeOut:'17:00'})}>
                                  ✓
                                </button>
                              )}
                              {(!att || att.status !== 'Absent') && (
                                <button className="icon-btn" title="Quick Absent" style={{color:'var(--rust)'}}
                                  onClick={()=>handleSaveAttendance(w.id, w.name, {status:'Absent', timeIn:null, timeOut:null, hoursWorked:0})}>
                                  ✕
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      ) : (
        <DataTable
          title="Workforce & Certification Registry (2-on/2-off)"
          sub={`${onSiteCount} on site now · certs auto-flag if expiring within ${data.settings.certAlertDays||30} days`}
          columns={registryCols}
          rows={data.workforce}
          addLabel="Worker"

/* ---------- module: Cost & Schedule ---------- */
function CostSchedule({data, mutate}){
  const cols = [
    {key:'name', label:'Activity', field:{required:true}},
    {key:'costCode', label:'Cost Code', field:{required:true}},
    {key:'budget', label:'Budget', numeric:true, field:{type:'number', required:true}, render:r=>fmtMoney(r.budget)},
    {key:'committed', label:'Committed', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.committed)},
    {key:'inTransit', label:'In Transit', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.inTransit)},
    {key:'installed', label:'Installed/Earned', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.installed)},
    {key:'variance', label:'Variance', numeric:true, render:r=>{
      const spent = Number(r.committed||0)+Number(r.inTransit||0)+Number(r.installed||0);
      const v = Number(r.budget||0)-spent;
      return <span style={{color: v<0 ? '#E8A38F':'#8FCB9F'}}>{fmtMoney(v)}</span>;
    }},
    {key:'linkedShipmentId', label:'Linked Shipment', field:{type:'select', options: data.shipments.map(s=>s.materialName||s.id)},
      render:r=>{
        const s = data.shipments.find(sh=>sh.id===r.linkedShipmentId);
        return s ? (s.materialName || 'Shipment') : '—';
      }},
  ];

  const shipmentLabels = {};
  data.shipments.forEach(s => { shipmentLabels[s.id] = s.materialName || s.route || 'Shipment'; });
  const colsWithProperSelect = cols.map(c => c.key==='linkedShipmentId' ? {
    ...c,
    field:{type:'select', options: data.shipments.map(s=>s.id), optionLabels: shipmentLabels, allowEmpty:true, emptyLabel:'— none —', emptyMessage:'Add a shipment in Transport & Cost first'},
  } : c);

  return (
    <DataTable
      title="Cost & Schedule Integration"
      sub="Committed / in-transit / installed cost states per activity, linked to shipments"
      columns={colsWithProperSelect}
      rows={data.activities}
      addLabel="Activity"
      onSave={(rec, isNew)=> mutate('activities', isNew ? 'insert' : 'update', rec)}
      onDelete={(id)=> mutate('activities', 'delete', id)}
    />
  );
}

/* ---------- module: Field Reporting ---------- */
function FieldReporting({data, mutate}){
  const cols = [
    {key:'date', label:'Date', field:{type:'date', required:true}, render:r=>fmtDate(r.date)},
    {key:'type', label:'Type', field:{type:'select', options:['Progress','Incident','Delivery','Safety'], required:true}},
    {key:'description', label:'Description', field:{required:true}},
    {key:'photoUrls', label:'Photos', field:{type:'file', accept:'image/*', multiple:true},
      render:r=>{
        const urls = Array.isArray(r.photoUrls) ? r.photoUrls : [];
        if(urls.length===0) return <span style={{color:'var(--text-dim)'}}>—</span>;
        return (
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            {urls.slice(0,3).map((u,i)=>(
              <a key={i} href={u} target="_blank" rel="noopener noreferrer">
                <img src={u} alt="" style={{width:26,height:26,objectFit:'cover',borderRadius:4,border:'1px solid var(--border)',display:'block'}} />
              </a>
            ))}
            {urls.length>3 && <span style={{fontSize:11,color:'var(--text-dim)'}}>+{urls.length-3}</span>}
          </div>
        );
      }},
  ];
  const localOnly = data.fieldReports.filter(f=>f._pending).length;

  return (
    <DataTable
      title="Field Reports — Offline Data Entry"
      sub={`${localOnly} entries saved on this device. Auto-syncs to Supabase when connected.`}
      columns={cols}
      rows={data.fieldReports}
      addLabel="Field Report"
      onSave={(rec, isNew)=> mutate('fieldReports', isNew ? 'insert' : 'update', {...rec, photoCount:(rec.photoUrls||[]).length})}
      onDelete={(id)=> mutate('fieldReports', 'delete', id)}
    />
  );
}

/* ---------- module: Early Warning ---------- */
function EarlyWarning({alerts, onNavigate}){
  const critical = alerts.filter(a=>a.severity==='critical');
  const warning = alerts.filter(a=>a.severity==='warning');
  return (
    <div>
      <div className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">Critical ({critical.length})</div>
            <div className="panel-sub">Immediate action likely required · click a flag to jump to its source module</div>
          </div>
        </div>
        {critical.length===0 ? <div className="empty-state">No critical flags.</div> :
          critical.map((a,i)=>(
            <div className="alert-row clickable critical" key={i} onClick={()=>onNavigate(a.module || 'dashboard')}>
              <div className="alert-icon">⛔</div>
              <div>
                <div className="alert-title">{a.title}</div>
                <div className="alert-detail">{a.detail}</div>
                <div className="alert-cascade">↳ {a.cascade}</div>
              </div>
            </div>
          ))
        }
      </div>
      <div className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">Warning ({warning.length})</div>
            <div className="panel-sub">Monitor closely · click a flag to jump to its source module</div>
          </div>
        </div>
        {warning.length===0 ? <div className="empty-state">No warnings.</div> :
          warning.map((a,i)=>(
            <div className="alert-row clickable warning" key={i} onClick={()=>onNavigate(a.module || 'dashboard')}>
              <div className="alert-icon">⚠</div>
              <div>
                <div className="alert-title">{a.title}</div>
                <div className="alert-detail">{a.detail}</div>
                <div className="alert-cascade">↳ {a.cascade}</div>
              </div>
            </div>
          ))
        }
      </div>
    </div>
  );
}

function App(){
  const {data, mutate, mutateSettings, syncedAt, saving, error, reload, online, queueCount, syncing} = useStore();
  const [role, setRole] = useState(() => localStorage.getItem('pmis_current_role') || null);
  const [tab, setTab] = useState('dashboard');
  const [installPrompt, setInstallPrompt] = useState(null);
  const [installed, setInstalled] = useState(false);
  const [showInstallModal, setShowInstallModal] = useState(false);
  const [isIOS, setIsIOS] = useState(false);

  useEffect(()=>{
    const isApple = /iphone|ipad|ipod/i.test(navigator.userAgent) || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
    setIsIOS(isApple);

    const onBeforeInstall = (e) => { 
      e.preventDefault(); 
      setInstallPrompt(e); 
    };
    const onInstalled = () => { 
      setInstalled(true); 
      setInstallPrompt(null);
      setShowInstallModal(false);
    };
    window.addEventListener('beforeinstallprompt', onBeforeInstall);
    window.addEventListener('appinstalled', onInstalled);

    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) setInstalled(true);
    if(window.navigator.standalone === true) setInstalled(true);

    if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
    return () => {
      window.removeEventListener('beforeinstallprompt', onBeforeInstall);
      window.removeEventListener('appinstalled', onInstalled);
    };
  },[]);

  const handleSelectRole = (r) => {
    setRole(r);
    if(r){
      localStorage.setItem('pmis_current_role', r);
      setTab('dashboard');
    } else {
      localStorage.removeItem('pmis_current_role');
    }
  };

  const handleInstallClick = async () => {
    if(installPrompt){
      installPrompt.prompt();
      const { outcome } = await installPrompt.userChoice;
      if(outcome === 'accepted'){
        setInstalled(true);
      }
      setInstallPrompt(null);
    } else {
      setShowInstallModal(true);
    }
  };

  if(!role){
    return (
      <LandingPortal
        onSelectWorker={()=>handleSelectRole('worker')}
        onSelectAdmin={()=>handleSelectRole('admin')}
      />
    );
  }

  if(error && !data){
    return (
      <div style={{padding:40, color:'#F3ECDF', fontFamily:'Inter', maxWidth:560}}>
        <div style={{fontFamily:'Oswald', fontSize:20, marginBottom:10, color:'#E8A38F'}}>Couldn't load from Supabase</div>
        <div style={{color:'#A99A85', marginBottom:16, fontSize:14}}>{error}</div>
        <div style={{color:'#A99A85', fontSize:13, marginBottom:16}}>
          Double-check the SUPABASE_URL / SUPABASE_ANON_KEY constants near the top of the script,
          and that the schema SQL has been run in your Supabase project.
        </div>
        <div style={{display:'flex', gap:10}}>
          <button className="btn" onClick={reload}>Retry</button>
          <button className="btn secondary" onClick={()=>handleSelectRole(null)}>Return to Role Portal</button>
        </div>
      </div>
    );
  }

  if(!data){
    return <div style={{padding:40, color:'#A99A85', fontFamily:'Inter'}}>Loading site data…</div>;
  }

  const alerts = computeAlerts(data);
  const alerts_sorted = [...alerts].sort((a,b)=> (a.severity==='critical'?0:1) - (b.severity==='critical'?0:1));
  const critCount = alerts.filter(a=>a.severity==='critical').length;
  const warnCount = alerts.filter(a=>a.severity==='warning').length;

  const tabs = role === 'worker' ? WORKER_TABS : ADMIN_TABS;

  const titleMap = {
    dashboard:[role==='worker' ? 'Field Operations Dashboard' : 'Executive Dashboard', role==='worker' ? 'Active site risks, material staging & shift attendance' : 'Cross-module status, generated on each sync'],
    procurement:['Procurement & Long-Lead-Time Materials','Lead-time-driven ordering and supplier tiering'],
    transport:['Transportation & Logistics Cost Control','Multi-modal tracking, landed cost, fuel sub-ledger'],
    workforce:['Workforce, Daily Attendance & Camp Bed Matrix','2-on/2-off rotation, muster logs, time tracking & room allocation'],
    costschedule:['Cost & Schedule Integration','Committed / in-transit / installed cost states'],
    earlywarning:['Early Warning / Risk Alerts','Rule-based automated flags, ranked by severity'],
    field:['Field Reporting','Offline-first daily entry, prioritized sync'],
    docs:['Operational Manuals & Field Guides','Printable reference manuals, early warning rulebook & field dictionary'],
  };

  const handleNavigate = (targetTab) => {
    if(role === 'worker'){
      if(targetTab === 'workforce' || targetTab === 'earlywarning' || targetTab === 'dashboard'){
        setTab(targetTab);
      } else {
        setTab('earlywarning');
      }
    } else {
      setTab(targetTab);
    }
  };

  return (
    <div className="app">
      <div className="sidebar">
        <div className="brand">
          <div className="brand-mark"><span className="dot"></span>SITE PMIS</div>
          <div className="brand-sub">Brgy. Bolhoon, San Miguel, Surigao Del Sur</div>
        </div>
        <div className="nav">
          {tabs.map(t=>(
            <div key={t.id} className={"nav-item "+(tab===t.id?'active':'')} onClick={()=>setTab(t.id)}>
              <span className="nav-num">{t.num}</span>
              <span>{t.label}</span>
              {t.id==='earlywarning' && alerts.length>0 && <span className="nav-badge">{alerts.length}</span>}
            </div>
          ))}
        </div>
        <div className="sidebar-foot">
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10}}>
            <span style={{fontSize:11, color:'var(--text-dim)', fontWeight:600}}>
              {role === 'worker' ? '👷 Worker Mode' : '👑 Admin Mode'}
            </span>
            <button className="role-switch-btn" onClick={()=>handleSelectRole(null)} title="Switch Role">
              Switch
            </button>
          </div>
          {!installed && (
            <button className="install-btn" style={{width:'100%', justifyContent:'center', marginBottom:8}} onClick={handleInstallClick}>
              ⬇ Install Mobile App
            </button>
          )}
          <div>Offline-first · auto-syncs when connected</div>
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <div>
            <div className="topbar-title">{titleMap[tab] ? titleMap[tab][0] : 'Site PMIS'}</div>
            <div className="topbar-sub">{titleMap[tab] ? titleMap[tab][1] : ''}</div>
          </div>
          <div className="pulse-strip">
            <div style={{display:'flex', alignItems:'center', gap:8}}>
              {role === 'worker' ? (
                <span className="role-indicator worker">👷 Field Worker</span>
              ) : (
                <span className="role-indicator admin">👑 Administrator</span>
              )}
              <button className="role-switch-btn" onClick={()=>handleSelectRole(null)} title="Return to Role Portal">
                🚪 Switch Portal
              </button>
            </div>
            {critCount>0 && <div className="pulse-chip critical"><span className="pulse-dot critical"></span>{critCount} critical</div>}
            {warnCount>0 && <div className="pulse-chip warning"><span className="pulse-dot warning"></span>{warnCount} warning</div>}
            {alerts.length===0 && <div className="pulse-chip"><span className="pulse-dot ok"></span>nominal</div>}
            {!online && <div className="pulse-chip warning"><span className="pulse-dot warning"></span>offline</div>}
            {error && <div className="pulse-chip critical" title={error}>{error.length>40 ? 'offline copy' : error}</div>}
            <div className="sync-chip">
              {saving ? 'saving…' : syncing ? 'syncing…' : !online ? 'offline — saved locally' : (syncedAt ? 'synced '+syncedAt.toLocaleTimeString() : 'synced')}
            </div>
            {!installed && (
              <button className="install-btn" onClick={handleInstallClick}>
                📲 {isIOS ? 'Install on iPhone' : 'Install App'}
              </button>
            )}
          </div>
        </div>
        <div className="content">
          {tab==='dashboard' && <Dashboard data={data} alerts={alerts_sorted} onNavigate={handleNavigate} role={role} />}
          {tab==='procurement' && role==='admin' && <Procurement data={data} mutate={mutate} />}
          {tab==='transport' && role==='admin' && <Transportation data={data} mutate={mutate} mutateSettings={mutateSettings} />}
          {tab==='workforce' && <Workforce data={data} mutate={mutate} role={role} />}
          {tab==='costschedule' && role==='admin' && <CostSchedule data={data} mutate={mutate} />}
          {tab==='earlywarning' && <EarlyWarning alerts={alerts_sorted} onNavigate={handleNavigate} />}
          {tab==='field' && role==='admin' && <FieldReporting data={data} mutate={mutate} />}
          {tab==='docs' && role==='admin' && <DocsManual onNavigate={handleNavigate} />}
        </div>
      </div>

      {/* PWA Mobile Installation Guide Modal (for iPhone, iPad, Android) */}
      {showInstallModal && (
        <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) setShowInstallModal(false); }}>
          <div className="modal" style={{maxWidth:420}}>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              <img src="icon-192.png" alt="Site PMIS" style={{width:42, height:42, borderRadius:8, border:'1px solid var(--border)'}} />
              <div>
                <div style={{fontFamily:'Oswald', fontSize:18, fontWeight:700}}>Install Site PMIS App</div>
                <div style={{fontSize:12, color:'var(--text-dim)'}}>Full offline access & Home Screen launcher</div>
              </div>
            </div>

            {isIOS ? (
              <div>
                <div style={{fontSize:13, color:'var(--amber)', marginBottom:12, fontWeight:600}}>
                  📱 iPhone / iPad Installation Steps:
                </div>
                <div className="install-step-card">
                  <div className="install-step-num">1</div>
                  <div className="install-step-text">
                    Tap the <b>Share button</b> (square icon with an arrow pointing up <span style={{fontSize:15}}>⎋</span>) at the bottom of Safari.
                  </div>
                </div>
                <div className="install-step-card">
                  <div className="install-step-num">2</div>
                  <div className="install-step-text">
                    Scroll down the share options and tap <b>"Add to Home Screen"</b> <span style={{color:'var(--amber)'}}>➕</span>.
                  </div>
                </div>
                <div className="install-step-card">
                  <div className="install-step-num">3</div>
                  <div className="install-step-text">
                    Tap <b>"Add"</b> in the top right corner. The app will appear on your Home Screen!
                  </div>
                </div>
              </div>
            ) : (
              <div>
                <div style={{fontSize:13, color:'var(--amber)', marginBottom:12, fontWeight:600}}>
                  🤖 Android Installation Steps:
                </div>
                <div className="install-step-card">
                  <div className="install-step-num">1</div>
                  <div className="install-step-text">
                    Tap the <b>three dots menu (⋮)</b> in the top right corner of Chrome.
                  </div>
                </div>
                <div className="install-step-card">
                  <div className="install-step-num">2</div>
                  <div className="install-step-text">
                    Select <b>"Install app"</b> or <b>"Add to Home screen"</b>.
                  </div>
                </div>
                <div className="install-step-card">
                  <div className="install-step-num">3</div>
                  <div className="install-step-text">
                    Tap <b>"Install"</b> to confirm. The app will launch in standalone full-screen mode!
                  </div>
                </div>
              </div>
            )}

            <div className="modal-actions" style={{marginTop:16}}>
              <button className="btn" style={{width:'100%', justifyContent:'center'}} onClick={()=>setShowInstallModal(false)}>
                Got it
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
