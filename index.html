<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Site PMIS — Remote Mining Facility</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Site PMIS">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#17140F;
    --surface:#221D17;
    --surface2:#2B241C;
    --border:#3D342A;
    --text:#F3ECDF;
    --text-dim:#A99A85;
    --amber:#E8871E;
    --amber-dim:#7A4D18;
    --rust:#C4432B;
    --olive:#7A9070;
    --steel:#5C8AA6;
    --mono:'JetBrains Mono', monospace;
    --disp:'Oswald', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;}
  #root{min-height:100vh;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border);padding:20px 0;
    display:flex;flex-direction:column;
  }
  .brand{
    padding:0 18px 18px 18px;border-bottom:1px solid var(--border);margin-bottom:10px;
  }
  .brand-mark{
    font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:0.5px;
    color:var(--text);display:flex;align-items:center;gap:8px;
  }
  .brand-mark .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 8px var(--amber);}
  .brand-sub{font-size:11px;color:var(--text-dim);margin-top:4px;letter-spacing:0.4px;text-transform:uppercase;}
  .nav{flex:1;padding:6px 10px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;
    color:var(--text-dim);cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:2px;
    border-left:3px solid transparent;transition:background .15s,color .15s;
  }
  .nav-item:hover{background:var(--surface2);color:var(--text);}
  .nav-item.active{background:var(--surface2);color:var(--amber);border-left:3px solid var(--amber);}
  .nav-num{font-family:var(--mono);font-size:11px;color:var(--text-dim);width:16px;}
  .nav-badge{
    margin-left:auto;background:var(--rust);color:#fff;font-family:var(--mono);
    font-size:10px;padding:1px 6px;border-radius:10px;
  }
  .sidebar-foot{padding:14px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px;border-bottom:1px solid var(--border);background:var(--surface);
    position:sticky;top:0;z-index:5;
  }
  .topbar-title{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:0.3px;}
  .topbar-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .pulse-strip{display:flex;align-items:center;gap:12px;}
  .pulse-chip{
    display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;
    font-family:var(--mono);font-size:12px;border:1px solid var(--border);background:var(--surface2);
  }
  .pulse-chip.critical{border-color:var(--rust);color:#F2C4B8;}
  .pulse-chip.warning{border-color:var(--amber-dim);color:#F0D3A8;}
  .pulse-dot{width:8px;height:8px;border-radius:50%;}
  .pulse-dot.critical{background:var(--rust);animation:pulse 1.4s infinite;}
  .pulse-dot.warning{background:var(--amber);}
  .pulse-dot.ok{background:var(--olive);}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,67,43,.6);}70%{box-shadow:0 0 0 7px rgba(196,67,43,0);}100%{box-shadow:0 0 0 0 rgba(196,67,43,0);}}
  .sync-chip{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-dim);font-family:var(--mono);}

  .content{padding:24px 26px;flex:1;overflow-x:hidden;}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
  .kpi-card{
    background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;
    border-top:2px solid var(--amber-dim);
  }
  .kpi-card.critical{border-top-color:var(--rust);}
  .kpi-card.ok{border-top-color:var(--olive);}
  .clickable{cursor:pointer;transition:border-color .15s,transform .1s;}
  .clickable:hover{border-color:var(--amber);}
  .kpi-card.clickable:hover{transform:translateY(-1px);}
  .alert-row.clickable:hover{background:#332B21;}
  .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-dim);margin-bottom:6px;}
  .kpi-value{font-family:var(--disp);font-size:26px;font-weight:600;}
  .kpi-foot{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:18px 20px;margin-bottom:20px;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-title{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:0.3px;}
  .panel-sub{font-size:12px;color:var(--text-dim);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid-3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;}
  @media(max-width:1100px){.grid-3{grid-template-columns:1fr;}}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

  .btn{
    background:var(--amber);color:#1A1305;border:none;padding:8px 14px;border-radius:6px;
    font-weight:600;font-size:12.5px;cursor:pointer;font-family:var(--body);display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:#f5952b;}
  .btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn.secondary:hover{border-color:var(--text-dim);}
  .btn.danger{background:transparent;color:var(--rust);border:1px solid var(--rust);}
  .btn.sm{padding:4px 9px;font-size:11.5px;}

  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
  th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--text-dim);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;
  }
  td{padding:9px 10px;border-bottom:1px solid #2A241C;vertical-align:middle;}
  tr:hover td{background:var(--surface2);}
  tr.row-pending td{background:rgba(232,135,30,0.06);}
  .num{font-family:var(--mono);}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:5px;cursor:pointer;font-size:12px;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-family:var(--mono);font-weight:500;}
  .badge.ordered{background:#2A3242;color:#9DBBE0;}
  .badge.hub{background:#3A2E1C;color:#E8C285;}
  .badge.port{background:#3A2E1C;color:#E8C285;}
  .badge.laydown{background:#2E3A2A;color:#B3D19A;}
  .badge.installed{background:#233A2C;color:#8FCB9F;}
  .badge.delivered{background:#233A2C;color:#8FCB9F;}
  .badge.transit{background:#3A2E1C;color:#E8C285;}
  .badge.checkpoint{background:#3A2E1C;color:#E8C285;}
  .badge.notstarted{background:#2A2A2A;color:#B0A995;}
  .badge.none{background:#233A2C;color:#8FCB9F;}
  .badge.watch{background:#3A2E1C;color:#E8C285;}
  .badge.delayed{background:#3A1F1A;color:#E8A38F;}
  .badge.onsite{background:#233A2C;color:#8FCB9F;}
  .badge.offrotation{background:#2A2A2A;color:#B0A995;}
  .badge.primary{background:#233A2C;color:#8FCB9F;}
  .badge.backup{background:#2A2A2A;color:#B0A995;}
  .badge.local{background:#2A2A2A;color:#B0A995;}
  .badge.synced{background:#233A2C;color:#8FCB9F;}
  
  .badge.present{background:#233A2C;color:#8FCB9F;border:1px solid rgba(143,203,159,0.3);}
  .badge.late{background:#3A2E1C;color:#E8C285;border:1px solid rgba(232,194,133,0.3);}
  .badge.absent{background:#3A1F1A;color:#E8A38F;border:1px solid rgba(232,163,143,0.3);}
  .badge.off{background:#2A2A2A;color:#B0A995;}

  /* Camp Bed Matrix Badges & Styles */
  .badge.bed-occupied{background:#3A1F1A;color:#E8A38F;border:1px solid rgba(232,163,143,0.3);font-weight:600;}
  .badge.bed-pending{background:#3A2E1C;color:#E8C285;border:1px solid rgba(232,194,133,0.5);font-weight:600;animation:pulse-amber 2s infinite;}
  .badge.bed-housekeeping{background:#1D2D3D;color:#9DBBE0;border:1px solid rgba(157,187,224,0.3);font-weight:600;}
  .badge.bed-available{background:#233A2C;color:#8FCB9F;border:1px solid rgba(143,203,159,0.3);font-weight:600;}
  .badge.delay-ext{background:#451A14;color:#FFA994;border:1px solid #C4432B;font-weight:600;font-size:10.5px;padding:2px 6px;margin-left:6px;border-radius:4px;}
  @keyframes pulse-amber{0%{box-shadow:0 0 0 0 rgba(232,135,30,0.4);}70%{box-shadow:0 0 0 6px rgba(232,135,30,0);}100%{box-shadow:0 0 0 0 rgba(232,135,30,0);}}

  .delay-banner{
    background:linear-gradient(90deg, #2B1D16 0%, #221D17 100%);
    border:1px solid #7A3D28;border-left:4px solid var(--rust);
    border-radius:8px;padding:12px 16px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  .delay-banner-title{font-family:var(--disp);font-size:15px;font-weight:600;color:#F2C4B8;display:flex;align-items:center;gap:8px;}
  .delay-banner-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}

  .filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .filter-chip{
    padding:4px 10px;border-radius:14px;font-size:11.5px;font-family:var(--body);font-weight:500;
    background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;
    transition:all .15s;
  }
  .filter-chip:hover{color:var(--text);border-color:var(--text-dim);}
  .filter-chip.active{background:var(--surface);border-color:var(--amber);color:var(--amber);}

  .alert-row{
    display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:7px;
    border:1px solid var(--border);margin-bottom:9px;background:var(--surface2);
  }
  .alert-row.critical{border-left:3px solid var(--rust);}
  .alert-row.warning{border-left:3px solid var(--amber);}
  .alert-icon{font-family:var(--mono);font-size:13px;padding-top:1px;}
  .alert-row.critical .alert-icon{color:var(--rust);}
  .alert-row.warning .alert-icon{color:var(--amber);}
  .alert-title{font-weight:600;font-size:13.5px;margin-bottom:2px;}
  .alert-detail{font-size:12.5px;color:var(--text-dim);}
  .alert-cascade{font-size:11.5px;color:var(--text-dim);margin-top:5px;font-family:var(--mono);}

  .empty-state{padding:26px;text-align:center;color:var(--text-dim);font-size:13px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,8,5,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  }
  .modal-title{font-family:var(--disp);font-size:17px;font-weight:600;margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;}
  .field input,.field select,.field textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:13px;font-family:var(--body);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .settings-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .settings-row .field{margin-bottom:0;min-width:160px;}
  .chart-wrap{position:relative;height:240px;}

  /* Install Button & Install Guide Styles */
  .install-btn{
    background:var(--surface2);border:1px solid var(--amber);color:var(--amber);
    padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--body);
    display:inline-flex;align-items:center;gap:6px;font-weight:600;transition:all .15s;
  }
  .install-btn:hover{background:var(--amber);color:#1A1305;}

  .install-step-card{
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;
  }
  .install-step-num{
    background:var(--amber);color:#1A1305;font-weight:bold;font-size:12px;
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;margin-top:2px;font-family:var(--mono);
  }
  .install-step-text{font-size:13px;line-height:1.4;color:var(--text);}
  .install-step-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}

  /* Calendar & Attendance Sub-Navigation Styles */
  .tab-pills{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:12px;}
  .tab-pill{
    padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;
    background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);
    transition:all .15s;
  }
  .tab-pill:hover{color:var(--text);border-color:var(--text-dim);}
  .tab-pill.active{background:var(--amber-dim);border-color:var(--amber);color:var(--text);}
  
  .calendar-bar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    padding:12px 16px;margin-bottom:16px;
  }
  .date-controls{display:flex;align-items:center;gap:8px;}
  .date-display{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:0.3px;}
  .cal-picker{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:6px 10px;border-radius:6px;font-size:12.5px;font-family:var(--mono);cursor:pointer;
  }
  .time-badge{font-family:var(--mono);font-size:12px;color:var(--text);background:var(--bg);padding:3px 7px;border-radius:4px;border:1px solid var(--border);}

  /* ---------- mobile ---------- */
  @media (max-width: 780px){
    .app{ flex-direction:column; min-height:auto; }
    .sidebar{
      width:100%; flex-direction:row; align-items:center; gap:10px;
      border-right:none; border-bottom:1px solid var(--border); padding:10px 12px;
      position:sticky; top:0; z-index:6;
    }
    .brand{ border-bottom:none; padding:0; margin-bottom:0; flex-shrink:0; }
    .brand-sub{ display:none; }
    .sidebar-foot{ display:none; }
    .nav{
      display:flex; flex-direction:row; gap:4px; padding:0; flex:1;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
    }
    .nav-item{
      flex-direction:column; align-items:center; gap:2px; white-space:nowrap;
      padding:6px 10px; margin-bottom:0; border-left:none; border-bottom:3px solid transparent;
      font-size:10.5px;
    }
    .nav-item.active{ border-left:none; border-bottom:3px solid var(--amber); }
    .nav-num{ display:none; }
    .nav-badge{ margin-left:4px; }
    .topbar{ flex-wrap:wrap; gap:10px; padding:12px 14px; position:static; }
    .topbar-title{ font-size:16px; }
    .content{ padding:14px; }
    .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; }
    .kpi-value{ font-size:21px; }
    .grid-2,.grid-3{ grid-template-columns:1fr; }
    .panel{ padding:14px 14px; }
    .modal{ max-width:100%; width:100%; height:100%; max-height:100%; border-radius:0; }
    .pulse-strip{ flex-wrap:wrap; gap:8px; width:100%; }
    .calendar-bar{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>

/* ---------- table <-> app-state field maps ---------- */
const TABLE_MAPS = {
  materials: {table:'materials', fields:{name:'name', supplier:'supplier', qty:'qty', unitCost:'unit_cost', supplierLeadDays:'supplier_lead_days', transportLeadDays:'transport_lead_days', bufferDays:'buffer_days', needBy:'need_by', status:'status'}},
  suppliers: {table:'suppliers', fields:{name:'name', item:'item', tier:'tier', avgLeadDays:'avg_lead_days', reliabilityPct:'reliability_pct', route:'route'}},
  shipments: {table:'shipments', fields:{materialName:'material_name', route:'route', mode:'mode', legStatus:'leg_status', expectedDate:'expected_date', actualDate:'actual_date', weatherFlag:'weather_flag', freight:'freight', fuelSurcharge:'fuel_surcharge', demurrage:'demurrage', handling:'handling', insurance:'insurance'}},
  fuel: {table:'fuel_log', fields:{date:'date', type:'type', liters:'liters', cost:'cost', notes:'notes'}},
  workforce: {table:'workforce', fields:{name:'name', trade:'trade', rotationIn:'rotation_in', rotationOut:'rotation_out', certName:'cert_name', certExpiry:'cert_expiry', status:'status'}},
  attendance: {table:'workforce_attendance', fields:{workerId:'worker_id', workerName:'worker_name', date:'date', status:'status', timeIn:'time_in', timeOut:'time_out', hoursWorked:'hours_worked', notes:'notes'}},
  campBeds: {table:'camp_beds', fields:{roomId:'room_id', bedId:'bed_id', currentOccupant:'current_occupant', shiftStatus:'shift_status', vacatingDate:'vacating_date', nextOccupant:'next_occupant', status:'status', roadDelayExt:'road_delay_ext', notes:'notes'}},
  activities: {table:'activities', fields:{name:'name', costCode:'cost_code', budget:'budget', committed:'committed', inTransit:'in_transit', installed:'installed', linkedShipmentId:'linked_shipment_id'}},
  fieldReports: {table:'field_reports', fields:{date:'date', type:'type', description:'description', photoCount:'photo_count', photoUrls:'photo_urls'}},
};

const toSnakeRow = (stateKey, obj) => {
  const map = TABLE_MAPS[stateKey].fields;
  const row = {};
  Object.entries(map).forEach(([camel,snake]) => {
    if(obj[camel] !== undefined) row[snake] = (obj[camel] === '' ? null : obj[camel]);
  });
  return row;
};
const toCamelRow = (stateKey, row) => {
  const map = TABLE_MAPS[stateKey].fields;
  const obj = {id: row.id};
  Object.entries(map).forEach(([camel,snake]) => { obj[camel] = row[snake]; });
  return obj;
};

async function sbFetchAll(stateKey){
  const {data, error} = await supabaseClient.from(TABLE_MAPS[stateKey].table).select('*').order('created_at', {ascending:true});
  if(error) throw error;
  return data.map(r => toCamelRow(stateKey, r));
}
async function sbInsert(stateKey, record){
  const {data, error} = await supabaseClient.from(TABLE_MAPS[stateKey].table).insert(toSnakeRow(stateKey, record)).select().single();
  if(error) throw error;
  return toCamelRow(stateKey, data);
}
async function sbUpdate(stateKey, id, record){
  const {data, error} = await supabaseClient.from(TABLE_MAPS[stateKey].table).update(toSnakeRow(stateKey, record)).eq('id', id).select().single();
  if(error) throw error;
  return toCamelRow(stateKey, data);
}
async function sbDelete(stateKey, id){
  const {error} = await supabaseClient.from(TABLE_MAPS[stateKey].table).delete().eq('id', id);
  if(error) throw error;
}
async function sbUploadPhoto(file){
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safeName}`;
  const {error} = await supabaseClient.storage.from('field-photos').upload(path, file, {cacheControl:'3600', upsert:false});
  if(error){
    if(/not.?found/i.test(error.message || '')){
      throw new Error('Storage bucket "field-photos" doesn\'t exist yet in your Supabase project. Create it in Storage > New bucket (name it exactly "field-photos", toggle Public ON), then try again.');
    }
    throw error;
  }
  const {data} = supabaseClient.storage.from('field-photos').getPublicUrl(path);
  return data.publicUrl;
}

async function sbFetchSettings(){
  const {data, error} = await supabaseClient.from('settings').select('*').eq('id',1).single();
  if(error) throw error;
  return {fuelStockLiters:data.fuel_stock_liters, fuelAlertDays:data.fuel_alert_days, certAlertDays:data.cert_alert_days, checkpointGraceDays:data.checkpoint_grace_days};
}
async function sbUpdateSettings(settings){
  const {error} = await supabaseClient.from('settings').update({
    fuel_stock_liters: settings.fuelStockLiters,
    fuel_alert_days: settings.fuelAlertDays,
    cert_alert_days: settings.certAlertDays,
    checkpoint_grace_days: settings.checkpointGraceDays,
  }).eq('id',1);
  if(error) throw error;
}

const CACHE_KEY = 'pmis_cache_v1';
const QUEUE_KEY = 'pmis_queue_v1';
const readCache = () => { try{ const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } };
const writeCache = (d) => { try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(e){} };
const readQueueStorage = () => { try{ const raw = localStorage.getItem(QUEUE_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } };
const writeQueueStorage = (q) => { try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){} };

const remapForeignKeys = (stateKey, payload, idMap) => {
  if(stateKey === 'activities' && payload.linkedShipmentId && idMap[payload.linkedShipmentId]){
    return {...payload, linkedShipmentId: idMap[payload.linkedShipmentId]};
  }
  return payload;
};

function useStore(){
  const [data,setData] = useState(null);
  const [syncedAt,setSyncedAt] = useState(null);
  const [saving,setSaving] = useState(false);
  const [error,setError] = useState(null);
  const [online, setOnline] = useState(navigator.onLine);
  const [queueCount, setQueueCount] = useState(readQueueStorage().length);
  const [syncing, setSyncing] = useState(false);
  const queueRef = useRef(readQueueStorage());
  const syncingRef = useRef(false);

  const persistQueue = () => { writeQueueStorage(queueRef.current); setQueueCount(queueRef.current.length); };
  const enqueue = (item) => { queueRef.current = [...queueRef.current, item]; persistQueue(); };

  const loadAll = async () => {
    try{
      const [materials, suppliers, shipments, fuel, workforce, attendance, campBeds, activities, fieldReports, settings] = await Promise.all([
        sbFetchAll('materials'), sbFetchAll('suppliers'), sbFetchAll('shipments'), sbFetchAll('fuel'),
        sbFetchAll('workforce'), sbFetchAll('attendance').catch(()=>[]), sbFetchAll('campBeds').catch(()=>[]),
        sbFetchAll('activities'), sbFetchAll('fieldReports'), sbFetchSettings(),
      ]);
      const next = {
        materials,
        suppliers,
        shipments,
        fuel,
        workforce,
        attendance: attendance||[],
        campBeds: (campBeds && campBeds.length>0 ? campBeds : DEFAULT_CAMP_BEDS),
        activities,
        fieldReports,
        settings
      };
      setData(next);
      writeCache(next);
      setSyncedAt(new Date());
      setError(null);
    }catch(e){
      const cached = readCache();
      if(cached){
        if(!cached.attendance) cached.attendance = [];
        if(!cached.campBeds || cached.campBeds.length === 0) cached.campBeds = DEFAULT_CAMP_BEDS;
        setData(cached);
        setError(navigator.onLine ? ((e && e.message) || 'Could not reach Supabase — showing last saved data.') : null);
      } else {
        setError((e && e.message) || 'Could not reach Supabase, and no offline copy is saved on this device yet. Connect once to load data before going offline.');
      }
    }
  };

  const flushQueue = async () => {
    if(syncingRef.current || !navigator.onLine || queueRef.current.length === 0) return;
    syncingRef.current = true; setSyncing(true);
    const idMap = {};
    const remaining = [];
    for(const item of queueRef.current){
      try{
        if(item.action === 'insert'){
          const payload = remapForeignKeys(item.stateKey, item.payload, idMap);
          const created = await sbInsert(item.stateKey, payload);
          idMap[item.tempId] = created.id;
        } else if(item.action === 'update'){
          const realId = idMap[item.id] || item.id;
          if(typeof realId === 'string' && realId.startsWith('local-')){ 
            continue; 
          }
          const payload = remapForeignKeys(item.stateKey, item.payload, idMap);
          await sbUpdate(item.stateKey, realId, payload);
        } else if(item.action === 'delete'){
          const realId = idMap[item.id] || item.id;
          if(typeof realId === 'string' && realId.startsWith('local-')){ 
            continue; 
          }
          await sbDelete(item.stateKey, realId);
        } else if(item.action === 'update-settings'){
          await sbUpdateSettings(item.payload);
        }
      }catch(e){
        const msg = (e && e.message) || '';
        if(/relation.*does not exist|column.*does not exist|42P01|PGRST/i.test(msg)){
          console.warn(`[Auto-Sync] Skipped remote push for ${item.stateKey}:`, msg);
        } else {
          remaining.push(item);
        }
      }
    }
    queueRef.current = remaining;
    persistQueue();
    syncingRef.current = false; setSyncing(false);
    
    setData(prev => {
      if(!prev) return prev;
      const next = {...prev};
      Object.keys(TABLE_MAPS).forEach(k => {
        if(Array.isArray(next[k])){
          next[k] = next[k].map(row => ({...row, _pending:false}));
        }
      });
      writeCache(next);
      return next;
    });
    setSyncedAt(new Date());
  };

  useEffect(()=>{
    loadAll();
    if(navigator.onLine) flushQueue();

    const goOnline = () => { setOnline(true); flushQueue(); };
    const goOffline = () => setOnline(false);
    const onFocus = () => { if(navigator.onLine) flushQueue(); };

    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    window.addEventListener('focus', onFocus);

    const interval = setInterval(() => {
      if(navigator.onLine && queueRef.current.length > 0 && !syncingRef.current) {
        flushQueue();
      }
    }, 6000);

    return () => {
      window.removeEventListener('online', goOnline);
      window.removeEventListener('offline', goOffline);
      window.removeEventListener('focus', onFocus);
      clearInterval(interval);
    };
  },[]);

  const mutate = async (stateKey, action, payload) => {
    setSaving(true);
    const isTemp = (id) => typeof id === 'string' && id.startsWith('local-');

    if(action === 'insert'){
      const tempId = 'local-' + uid();
      const optimistic = {...payload, id: tempId, _pending: !navigator.onLine};
      setData(prev => { 
        const currentList = prev[stateKey] || [];
        const next = {...prev, [stateKey]: [...currentList, optimistic]}; 
        writeCache(next); 
        return next; 
      });
      if(navigator.onLine){
        try{
          const created = await sbInsert(stateKey, payload);
          setData(prev => { const next = {...prev, [stateKey]: prev[stateKey].map(r=>r.id===tempId?created:r)}; writeCache(next); return next; });
          setSyncedAt(new Date()); setError(null);
        }catch(e){
          const msg = (e && e.message) || '';
          if(!/relation.*does not exist|column.*does not exist/i.test(msg)){
            enqueue({qid:uid(), stateKey, action:'insert', tempId, payload});
          } else {
            setSyncedAt(new Date());
          }
        }
      } else {
        enqueue({qid:uid(), stateKey, action:'insert', tempId, payload});
      }
    } else if(action === 'update'){
      setData(prev => { 
        const currentList = prev[stateKey] || [];
        const next = {...prev, [stateKey]: currentList.map(r=>r.id===payload.id?{...r,...payload,_pending:!navigator.onLine}:r)}; 
        writeCache(next); 
        return next; 
      });
      if(navigator.onLine && !isTemp(payload.id)){
        try{
          const updated = await sbUpdate(stateKey, payload.id, payload);
          setData(prev => { const next = {...prev, [stateKey]: prev[stateKey].map(r => r.id === payload.id ? updated : r)}; writeCache(next); return next; });
          setSyncedAt(new Date()); setError(null);
        }catch(e){
          const msg = (e && e.message) || '';
          if(!/relation.*does not exist|column.*does not exist/i.test(msg)){
            enqueue({qid:uid(), stateKey, action:'update', id:payload.id, payload});
          }
        }
      } else if(!navigator.onLine){
        enqueue({qid:uid(), stateKey, action:'update', id:payload.id, payload});
      }
    } else if(action === 'delete'){
      setData(prev => { 
        const currentList = prev[stateKey] || [];
        const next = {...prev, [stateKey]: currentList.filter(r => r.id !== payload)}; 
        writeCache(next); 
        return next; 
      });
      if(navigator.onLine && !isTemp(payload)){
        try{
          await sbDelete(stateKey, payload);
          setSyncedAt(new Date()); setError(null);
        }catch(e){
          const msg = (e && e.message) || '';
          if(!/relation.*does not exist|column.*does not exist/i.test(msg)){
            enqueue({qid:uid(), stateKey, action:'delete', id:payload});
          }
        }
      } else if(!navigator.onLine){
        enqueue({qid:uid(), stateKey, action:'delete', id:payload});
      }
    }
    setSaving(false);
  };

  const mutateSettings = async (nextSettings) => {
    setData(prev => { const next = {...prev, settings: nextSettings}; writeCache(next); return next; });
    if(navigator.onLine){
      try{
        await sbUpdateSettings(nextSettings);
        setSyncedAt(new Date()); setError(null);
      }catch(e){ enqueue({qid:uid(), stateKey:'settings', action:'update-settings', payload:nextSettings}); }
    } else {
      enqueue({qid:uid(), stateKey:'settings', action:'update-settings', payload:nextSettings});
    }
  };

  return {data, mutate, mutateSettings, syncedAt, saving, error, reload:loadAll, online, queueCount, syncing, flushQueue};
}

/* ---------- generic CRUD table ---------- */
function DataTable({title, sub, columns, rows, onSave, onDelete, addLabel, renderExtra}){
  const [modalRow, setModalRow] = useState(null);
  const [form, setForm] = useState({});
  const [pendingFiles, setPendingFiles] = useState({});
  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState(null);

  const openNew = () => { setForm({}); setPendingFiles({}); setUploadError(null); setModalRow({}); };
  const openEdit = (row) => { setForm({...row}); setPendingFiles({}); setUploadError(null); setModalRow(row); };
  const close = () => { setModalRow(null); setForm({}); setPendingFiles({}); setUploadError(null); };

  const submit = async (e) => {
    e.preventDefault();
    setUploadError(null);
    let finalForm = {...form};
    const fileCols = columns.filter(c => c.field && c.field.type === 'file');
    if(fileCols.length){
      setUploading(true);
      try{
        for(const c of fileCols){
          const files = pendingFiles[c.key];
          if(files && files.length){
            const existing = Array.isArray(finalForm[c.key]) ? finalForm[c.key] : [];
            const uploaded = [];
            for(const file of Array.from(files)){
              uploaded.push(await sbUploadPhoto(file));
            }
            finalForm[c.key] = [...existing, ...uploaded];
          }
        }
      }catch(err){
        setUploading(false);
        setUploadError((err && err.message) || 'Photo upload failed. Check that the "field-photos" storage bucket exists and is public.');
        return;
      }
      setUploading(false);
    }
    const isNew = !(modalRow && modalRow.id);
    const record = isNew ? finalForm : {...finalForm, id: modalRow.id};
    onSave(record, isNew);
    close();
  };

  return (
    <div className="panel">
      <div className="panel-head">
        <div>
          <div className="panel-title">{title}</div>
          {sub && <div className="panel-sub">{sub}</div>}
        </div>
        <button className="btn" onClick={openNew}>+ {addLabel || 'Add'}</button>
      </div>
      {rows.length === 0 ? (
        <div className="empty-state">No records yet. Add the first one to start tracking.</div>
      ) : (
        <div className="table-scroll">
        <table>
          <thead><tr>
            {columns.map(c => <th key={c.key}>{c.label}</th>)}
            <th></th>
          </tr></thead>
          <tbody>
            {rows.map(row => (
              <tr key={row.id} className={row._pending ? 'row-pending' : ''}>
                {columns.map(c => (
                  <td key={c.key} className={c.numeric ? 'num' : ''}>
                    {c.render ? c.render(row) : row[c.key]}
                  </td>
                ))}
                <td>
                  <div className="row-actions">
                    <button className="icon-btn" onClick={()=>openEdit(row)} title="Edit">✎</button>
                    <button className="icon-btn" onClick={()=>onDelete(row.id)} title="Delete">✕</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      )}
      {renderExtra}

      {modalRow !== null && (
        <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) close(); }}>
          <div className="modal">
            <div className="modal-title">{modalRow.id ? 'Edit record' : addLabel || 'New record'}</div>
            <form onSubmit={submit}>
              {columns.filter(c=>c.field).map(c => (
                <div className="field" key={c.key}>
                  <label>{c.label}</label>
                  {c.field.type === 'file' ? (
                    <div>
                      {Array.isArray(form[c.key]) && form[c.key].length > 0 && (
                        <div className="tag-row" style={{marginBottom:8}}>
                          {form[c.key].map((url,i) => (
                            <div key={i} style={{position:'relative'}}>
                              <img src={url} alt="" style={{width:48,height:48,objectFit:'cover',borderRadius:6,border:'1px solid var(--border)',display:'block'}} />
                              <button type="button"
                                onClick={()=>setForm({...form, [c.key]: form[c.key].filter((_,idx)=>idx!==i)})}
                                title="Remove"
                                style={{position:'absolute',top:-6,right:-6,background:'var(--rust)',color:'#fff',border:'none',borderRadius:'50%',width:18,height:18,fontSize:11,cursor:'pointer',lineHeight:'16px',padding:0}}>×</button>
                            </div>
                          ))}
                        </div>
                      )}
                      <input type="file" accept={c.field.accept || 'image/*'} multiple={c.field.multiple !== false}
                        onChange={e=>setPendingFiles({...pendingFiles, [c.key]: e.target.files})} />
                      {pendingFiles[c.key] && pendingFiles[c.key].length > 0 && (
                        <div style={{fontSize:11.5, color:'var(--text-dim)', marginTop:4}}>{pendingFiles[c.key].length} file(s) queued — uploads on save</div>
                      )}
                    </div>
                  ) : c.field.type === 'select' ? (
                    <select
                      value={form[c.key] ?? ''}
                      onChange={e=>setForm({...form,[c.key]:e.target.value})}
                      required={c.field.required}
                    >
                      {c.field.allowEmpty || !c.field.required ? (
                        <option value="">{c.field.emptyLabel || '— none —'}</option>
                      ) : (
                        <option value="" disabled>Select…</option>
                      )}
                      {c.field.options.length === 0 && (
                        <option value="" disabled>{c.field.emptyMessage || 'No options available yet'}</option>
                      )}
                      {c.field.options.map(o => (
                        <option key={o} value={o}>{c.field.optionLabels ? (c.field.optionLabels[o] ?? o) : o}</option>
                      ))}
                    </select>
                  ) : (
                    <input
                      type={c.field.type || 'text'}
                      step={c.field.type==='number' ? 'any' : undefined}
                      value={form[c.key] ?? ''}
                      onChange={e=>setForm({...form,[c.key]: c.field.type==='number' ? e.target.value : e.target.value})}
                      required={c.field.required}
                      placeholder={c.field.placeholder || ''}
                    />
                  )}
                </div>
              ))}
              {uploadError && <div style={{color:'#E8A38F', fontSize:12.5, marginBottom:10}}>{uploadError}</div>}
              <div className="modal-actions">
                <button type="button" className="btn secondary" onClick={close}>Cancel</button>
                <button type="submit" className="btn" disabled={uploading}>{uploading ? 'Uploading…' : 'Save record'}</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- alert engine (Module 7) ---------- */
function computeAlerts(data){
  if(!data) return [];
  const alerts = [];
  const today = todayISO();
  const grace = data.settings.checkpointGraceDays ?? 2;

  // Shipment behind checkpoint
  data.shipments.forEach(s => {
    if(s.legStatus !== 'Delivered' && s.expectedDate){
      const behind = daysBetween(s.expectedDate, today) - grace;
      if(behind > 0){
        const linked = data.activities.filter(a => a.linkedShipmentId === s.id);
        alerts.push({
          severity:'critical',
          module:'transport',
          title: `Shipment behind schedule — ${s.materialName || s.route || 'shipment'}`,
          detail: `Expected ${fmtDate(s.expectedDate)}, still "${s.legStatus}" (${behind}d past grace period).`,
          cascade: linked.length ? `Affects activity: ${linked.map(a=>a.name).join(', ')}` : 'No linked activity on record.',
        });
      }
    }
    if(s.weatherFlag && s.weatherFlag !== 'None'){
      alerts.push({
        severity: s.weatherFlag === 'Delayed' ? 'critical' : 'warning',
        module:'transport',
        title: `Weather flag on route — ${s.route || 'unnamed route'}`,
        detail: `Shipment "${s.materialName || s.id}" flagged ${s.weatherFlag.toLowerCase()} on this corridor.`,
        cascade: 'Crew changes sharing this route/window may also be at risk.',
      });
    }
  });

  // Materials past must-order-by
  data.materials.forEach(m => {
    if(m.status !== 'Installed'){
      const mustOrderBy = addDays(m.needBy, -(Number(m.supplierLeadDays||0)+Number(m.transportLeadDays||0)+Number(m.bufferDays||0)));
      if(mustOrderBy < today && !['Ordered','Regional Hub','Provincial Port','Site Laydown','Installed'].includes(m.status)){
        alerts.push({
          severity:'critical',
          module:'procurement',
          title:`Must-order-by date passed — ${m.name}`,
          detail:`Needed on site by ${fmtDate(m.needBy)}; must-order-by was ${fmtDate(mustOrderBy)}.`,
          cascade:'Order immediately or re-sequence dependent schedule activities.',
        });
      }
    }
  });

  // Certifications expiring before next rotation
  data.workforce.forEach(w => {
    if(w.certExpiry){
      const alertDays = data.settings.certAlertDays ?? 30;
      const daysLeft = daysBetween(today, w.certExpiry);
      if(daysLeft <= alertDays){
        alerts.push({
          severity: daysLeft <= 7 ? 'critical' : 'warning',
          module:'workforce',
          title:`Certification expiring — ${w.name}`,
          detail:`${w.certName || 'Certification'} expires ${fmtDate(w.certExpiry)} (${daysLeft}d away). Rotation out: ${fmtDate(w.rotationOut)}.`,
          cascade:`Role at risk of going unmanned: ${w.trade}.`,
        });
      }
    }
  });

  // Fuel stock
  const consumption = data.fuel.filter(f=>f.type==='Consumption');
  const avgDaily = consumption.length ? consumption.reduce((s,f)=>s+Number(f.liters||0),0)/Math.max(consumption.length,1) : 0;
  const daysOfFuel = avgDaily > 0 ? Math.round((data.settings.fuelStockLiters||0)/avgDaily) : null;
  if(daysOfFuel !== null && daysOfFuel <= (data.settings.fuelAlertDays ?? 7)){
    alerts.push({
      severity: daysOfFuel <= 3 ? 'critical' : 'warning',
      module:'transport',
      title:'Fuel stock below threshold',
      detail:`Approx. ${daysOfFuel} days of fuel remaining at current consumption rate (${Math.round(avgDaily)} L/day).`,
      cascade:'Equipment and generator operation at risk of idling.',
    });
  }

  // Cost variance
  data.activities.forEach(a => {
    const spent = Number(a.committed||0)+Number(a.inTransit||0)+Number(a.installed||0);
    if(spent > Number(a.budget||0)){
      alerts.push({
        severity:'warning',
        module:'costschedule',
        title:`Cost variance — ${a.name}`,
        detail:`Committed+in-transit+installed (${fmtMoney(spent)}) exceeds budget (${fmtMoney(a.budget)}).`,
        cascade:`Cost code ${a.costCode}.`,
      });
    }
  });

  // Camp Bed Matrix — Hot-Bedding & Road Delay Safety Flags
  (data.campBeds || []).forEach(b => {
    if(b.roadDelayExt){
      alerts.push({
        severity:'critical',
        module:'workforce',
        title:`Road Delay Bed Extension — ${b.bedId}`,
        detail:`${b.currentOccupant} vacating date extended +24h to ${fmtDate(b.vacatingDate)} due to convoy weather/mud delay.`,
        cascade: b.nextOccupant && b.nextOccupant !== 'None' ? `Inbound occupant (${b.nextOccupant}) held in transit staging to prevent hot-bedding conflict.` : 'Bed locked until outbound transport departs.',
      });
    } else if(b.status === 'Pending Handover' && b.vacatingDate === today){
      alerts.push({
        severity:'warning',
        module:'workforce',
        title:`Same-Day Bed Turnover — ${b.bedId}`,
        detail:`${b.currentOccupant} vacating today (${fmtDate(b.vacatingDate)}); incoming: ${b.nextOccupant}.`,
        cascade:'Outgoing departure must clear Housekeeping before incoming check-in.',
      });
    }
  });

  return alerts;
}

/* ---------- dashboard with Spend Budget Pie Chart ---------- */
function Dashboard({data, alerts, onNavigate}){
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const spendPieRef = useRef(null);
  const spendPieInstance = useRef(null);
  const materialPieRef = useRef(null);
  const materialPieInstance = useRef(null);

  const critical = alerts.filter(a=>a.severity==='critical').length;
  const warning = alerts.filter(a=>a.severity==='warning').length;

  const totalBudget = data.activities.reduce((s,a)=>s+Number(a.budget||0),0);
  const totalSpent = data.activities.reduce((s,a)=>s+Number(a.committed||0)+Number(a.inTransit||0)+Number(a.installed||0),0);
  const onSiteWorkers = data.workforce.filter(w=>w.status==='On Site').length;
  const activeShipments = data.shipments.filter(s=>s.legStatus!=='Delivered').length;

  // 1. Stacked Bar Chart (Committed / In-Transit / Installed)
  useEffect(()=>{
    if(!chartRef.current) return;
    if(chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(chartRef.current, {
      type:'bar',
      data:{
        labels: data.activities.map(a=>a.costCode || a.name.slice(0,10)),
        datasets:[
          {label:'Committed', data:data.activities.map(a=>Number(a.committed||0)), backgroundColor:'#5C8AA6'},
          {label:'In Transit', data:data.activities.map(a=>Number(a.inTransit||0)), backgroundColor:'#E8871E'},
          {label:'Installed', data:data.activities.map(a=>Number(a.installed||0)), backgroundColor:'#7A9070'},
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        onClick:()=>onNavigate('costschedule'),
        onHover:(evt,els)=>{ evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
        scales:{
          x:{stacked:true, ticks:{color:'#A99A85'}, grid:{color:'#2A241C'}},
          y:{stacked:true, ticks:{color:'#A99A85'}, grid:{color:'#2A241C'}}
        },
        plugins:{legend:{labels:{color:'#F3ECDF', font:{size:11}}}}
      }
    });
    return ()=>{ if(chartInstance.current) chartInstance.current.destroy(); };
  },[data.activities]);

  // 2. Spend Budget Pie / Donut Chart with Hover Spend Name & Breakdown
  useEffect(()=>{
    if(!spendPieRef.current) return;
    if(spendPieInstance.current) spendPieInstance.current.destroy();

    const spendData = data.activities.map(a => {
      const spent = Number(a.committed || 0) + Number(a.inTransit || 0) + Number(a.installed || 0);
      return {
        name: a.name || 'Unnamed Spend',
        costCode: a.costCode || '',
        budget: Number(a.budget || 0),
        spent: spent
      };
    }).filter(item => item.spent > 0 || item.budget > 0);

    const labels = spendData.length ? spendData.map(d => d.name) : ['No Spend Logged'];
    const values = spendData.length ? spendData.map(d => d.spent || 0) : [1];
    const palette = [
      '#E8871E', '#5C8AA6', '#7A9070', '#C4432B', '#D97736',
      '#8B6F96', '#4E9F94', '#C99E38', '#A25946', '#6C8EBF'
    ];

    spendPieInstance.current = new Chart(spendPieRef.current, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: palette.slice(0, Math.max(labels.length, 1)),
          borderColor: '#221D17',
          borderWidth: 2,
          hoverOffset: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        onClick: () => onNavigate('costschedule'),
        onHover: (evt, els) => { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              color: '#A99A85',
              font: { size: 10, family: 'Inter' },
              boxWidth: 10,
              padding: 8
            }
          },
          tooltip: {
            backgroundColor: '#2B241C',
            titleColor: '#F3ECDF',
            titleFont: { size: 12, family: 'Oswald', weight: 'bold' },
            bodyColor: '#F3ECDF',
            bodyFont: { size: 11, family: 'JetBrains Mono' },
            borderColor: '#E8871E',
            borderWidth: 1,
            padding: 10,
            displayColors: true,
            callbacks: {
              title: function(context) {
                const idx = context[0].dataIndex;
                const item = spendData[idx];
                return item ? `${item.name} (${item.costCode || 'N/A'})` : 'Spend Item';
              },
              label: function(context) {
                const idx = context.dataIndex;
                const item = spendData[idx];
                if(!item) return '₱0';
                const totalAll = spendData.reduce((acc, curr) => acc + curr.spent, 0);
                const pctOfSpend = totalAll > 0 ? ((item.spent / totalAll) * 100).toFixed(1) : '0.0';
                const budgetUsage = item.budget > 0 ? ((item.spent / item.budget) * 100).toFixed(1) : '—';
                return [
                  ` Spent: ${fmtMoney(item.spent)} (${pctOfSpend}% of total spend)`,
                  ` Budget: ${fmtMoney(item.budget)} (${budgetUsage}% utilized)`
                ];
              }
            }
          }
        }
      }
    });

    return ()=>{ if(spendPieInstance.current) spendPieInstance.current.destroy(); };
  }, [data.activities]);

  // 3. Material Staging Status Doughnut Chart
  useEffect(()=>{
    if(!materialPieRef.current) return;
    if(materialPieInstance.current) materialPieInstance.current.destroy();
    const statuses = ['Ordered','Regional Hub','Provincial Port','Site Laydown','Installed'];
    const counts = statuses.map(st => data.materials.filter(m=>m.status===st).length);
    materialPieInstance.current = new Chart(materialPieRef.current, {
      type:'doughnut',
      data:{ labels: statuses, datasets:[{data:counts, backgroundColor:['#5C8AA6','#E8871E','#D97736','#7A9070','#8FCB9F']}] },
      options:{
        responsive:true, maintainAspectRatio:false,
        onClick:()=>onNavigate('procurement'),
        onHover:(evt,els)=>{ evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
        plugins:{legend:{position:'bottom', labels:{color:'#A99A85', font:{size:10}, boxWidth:10}}}
      }
    });
    return ()=>{ if(materialPieInstance.current) materialPieInstance.current.destroy(); };
  },[data.materials]);

  return (
    <div>
      <div className="kpi-row">
        <div className={"kpi-card clickable " + (critical>0?'critical':(warning>0?'':'ok'))} onClick={()=>onNavigate('earlywarning')}>
          <div className="kpi-label">Active Risk Flags</div>
          <div className="kpi-value">{alerts.length}</div>
          <div className="kpi-foot">{critical} critical · {warning} warning</div>
        </div>
        <div className="kpi-card clickable" onClick={()=>onNavigate('costschedule')}>
          <div className="kpi-label">Budget vs Spend</div>
          <div className="kpi-value">{totalBudget ? Math.round((totalSpent/totalBudget)*100) : 0}%</div>
          <div className="kpi-foot">{fmtMoney(totalSpent)} of {fmtMoney(totalBudget)}</div>
        </div>
        <div className="kpi-card clickable" onClick={()=>onNavigate('transport')}>
          <div className="kpi-label">Active Shipments</div>
          <div className="kpi-value">{activeShipments}</div>
          <div className="kpi-foot">{data.shipments.length} total on record</div>
        </div>
        <div className="kpi-card clickable" onClick={()=>onNavigate('workforce')}>
          <div className="kpi-label">Workforce On Site</div>
          <div className="kpi-value">{onSiteWorkers}</div>
          <div className="kpi-foot">{data.workforce.length} total tracked</div>
        </div>
      </div>

      <div className="grid-3" style={{marginBottom: 20}}>
        <div className="panel" style={{marginBottom:0}}>
          <div className="panel-head">
            <div>
              <div className="panel-title">Cost & Schedule Breakdown</div>
              <div className="panel-sub">Committed / In-Transit / Installed by Cost Code</div>
            </div>
          </div>
          <div className="chart-wrap"><canvas ref={chartRef}></canvas></div>
        </div>

        <div className="panel" style={{marginBottom:0}}>
          <div className="panel-head">
            <div>
              <div className="panel-title">Spend Budget Distribution</div>
              <div className="panel-sub">Hover to inspect spend name & budget allocation</div>
            </div>
          </div>
          <div className="chart-wrap"><canvas ref={spendPieRef}></canvas></div>
        </div>

        <div className="panel" style={{marginBottom:0}}>
          <div className="panel-head">
            <div>
              <div className="panel-title">Material Staging Status</div>
              <div className="panel-sub">Hub → Port → Laydown → Installed</div>
            </div>
          </div>
          <div className="chart-wrap"><canvas ref={materialPieRef}></canvas></div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">Top Active Risks</div>
            <div className="panel-sub">Auto-generated on each sync, ranked by severity</div>
          </div>
        </div>
        {alerts.length === 0 ? (
          <div className="empty-state">No active risk flags. Site conditions nominal.</div>
        ) : (
          alerts.slice(0,8).map((a,i)=>(
            <div className={"alert-row clickable " + a.severity} key={i} onClick={()=>onNavigate(a.module || 'earlywarning')}>
              <div className="alert-icon">{a.severity==='critical' ? '⛔' : '⚠'}</div>
              <div>
                <div className="alert-title">{a.title}</div>
                <div className="alert-detail">{a.detail}</div>
                <div className="alert-cascade">↳ {a.cascade}</div>
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

/* ---------- module: Transportation & Logistics Cost ---------- */
function Transportation({data, mutate, mutateSettings}){

    {key:'insurance', label:'Insurance', numeric:true, field:{type:'number'}, render:r=>fmtMoney(r.insurance)},
    {key:'landed', label:'Landed Cost', numeric:true, render:r=>fmtMoney(Number(r.freight||0)+Number(r.fuelSurcharge||0)+Number(r.demurrage||0)+Number(r.handling||0)+Number(r.insurance||0))},

  const fuelCols = [
    {key:'date', label:'Date', field:{type:'date', required:true}, render:r=>fmtDate(r.date)},

  ];

  const consumption = data.fuel.filter(f=>f.type==='Consumption');

  const [fuelStockDraft, setFuelStockDraft] = useState(data.settings.fuelStockLiters);
  const [fuelAlertDraft, setFuelAlertDraft] = useState(data.settings.fuelAlertDays);
  useEffect(()=>{ setFuelStockDraft(data.settings.fuelStockLiters); },[data.settings.fuelStockLiters]);
  useEffect(()=>{ setFuelAlertDraft(data.settings.fuelAlertDays); },[data.settings.fuelAlertDays]);

  return (
    <div>
      <DataTable
        title="Multi-Modal Shipment Tracking & Cost-Per-Shipment"

        columns={cols}
        rows={data.shipments}
        addLabel="Shipment"
        onSave={(rec, isNew)=> mutate('shipments', isNew ? 'insert' : 'update', rec)}
        onDelete={(id)=> mutate('shipments', 'delete', id)}

      <div className="panel">
        <div className="panel-head">
          <div>

            <div className="panel-sub">Current stock: <b>{(data.settings.fuelStockLiters||0).toLocaleString()} L</b> · Avg draw: {Math.round(avgDaily)} L/day · Est. runway: {daysOfFuel===null?'—':daysOfFuel+'d'}</div>
          </div>
        </div>
        <div className="settings-row" style={{marginBottom:14}}>
          <div className="field">
            <label>Current Fuel Stock (L)</label>
            <input type="number" value={fuelStockDraft}
              onChange={e=>setFuelStockDraft(e.target.value)}
              onBlur={()=>mutateSettings({...data.settings, fuelStockLiters:fuelStockDraft})}/>
          </div>
          <div className="field">
            <label>Alert threshold (days)</label>
            <input type="number" value={fuelAlertDraft}
              onChange={e=>setFuelAlertDraft(e.target.value)}
              onBlur={()=>mutateSettings({...data.settings, fuelAlertDays:fuelAlertDraft})}/>
          </div>
        </div>
        <DataTable
          title="Fuel Log"
          columns={fuelCols}
          rows={data.fuel}
          addLabel="Entry"
          onSave={(rec, isNew)=> mutate('fuel', isNew ? 'insert' : 'update', rec)}
          onDelete={(id)=> mutate('fuel', 'delete', id)}
        />
      </div>
    </div>
  );
}

/* ---------- module: Camp Bed Matrix (Workforce Sub-View) ---------- */
function CampBedMatrix({data, mutate}){
  const beds = (data.campBeds && data.campBeds.length > 0) ? data.campBeds : DEFAULT_CAMP_BEDS;
  const [filterStatus, setFilterStatus] = useState('ALL');
  const [searchTerm, setSearchTerm] = useState('');
  const [quickModal, setQuickModal] = useState(null);
  const [quickForm, setQuickForm] = useState({
    bedId: '',
    roomId: 'MH-A',
    currentOccupant: '',
    shiftStatus: 'Mid-Roster (Active)',
    vacatingDate: '',
    nextOccupant: 'None',
    status: 'Occupied',
    notes: '',
    actionType: 'checkin',
    selectedBedId: ''
  });
  const [safetyBannerMsg, setSafetyBannerMsg] = useState(null);

  const occupiedCount = beds.filter(b => b.status === 'Occupied').length;
  const pendingCount = beds.filter(b => b.status === 'Pending Handover').length;
  const housekeepingCount = beds.filter(b => b.status === 'Housekeeping').length;
  const availableCount = beds.filter(b => b.status === 'Available').length;
  const delayedCount = beds.filter(b => b.roadDelayExt).length;

  // Road Delay Safety Extension (+24h for all outbound/pending workers)
  const handleTriggerGlobalRoadDelay = () => {
    let affectedNames = [];
    beds.forEach(b => {
      const isOutbound = b.status === 'Pending Handover' || (b.shiftStatus && b.shiftStatus.includes('Leaving Today')) || (b.vacatingDate && b.vacatingDate <= todayISO());
      if(isOutbound){
        const currentVacating = b.vacatingDate || todayISO();
        const nextVacating = addDays(currentVacating, 1);
        affectedNames.push(b.currentOccupant || b.bedId);
        mutate('campBeds', 'update', {
          ...b,
          vacatingDate: nextVacating,
          shiftStatus: 'Shift Ending (Extended +24h — Convoy Delayed)',
          roadDelayExt: true,
          notes: (b.notes ? b.notes + ' | ' : '') + 'Transport convoy delayed by muddy roads; +24h safety extension applied'
        });
      }
    });
    setSafetyBannerMsg(`🛡️ ROAD DELAY SAFETY TRIGGERED: Outbound transport delayed by muddy roads/weather. Extended vacating date by +24h for ${affectedNames.join(', ') || 'outgoing crew'} to prevent unhousing. Inbound workers held in transit staging.`);
  };

  const handleClearGlobalRoadDelay = () => {
    beds.forEach(b => {
      if(b.roadDelayExt){
        mutate('campBeds', 'update', {
          ...b,
          shiftStatus: b.currentOccupant && b.currentOccupant !== 'Vacant' ? 'Mid-Roster (Active)' : 'Ready for Assignment',
          roadDelayExt: false
        });
      }
    });
    setSafetyBannerMsg(null);
  };

  const handleExtendSingleBed = (bed) => {
    const currentVacating = bed.vacatingDate || todayISO();
    const nextVacating = addDays(currentVacating, 1);
    mutate('campBeds', 'update', {
      ...bed,
      vacatingDate: nextVacating,
      shiftStatus: 'Shift Ending (Extended +24h — Convoy Delayed)',
      roadDelayExt: true,
      notes: (bed.notes ? bed.notes + ' | ' : '') + 'Outbound bus delayed; +24h bed safety extension applied'
    });
    setSafetyBannerMsg(`🛡️ Bed ${bed.bedId} (${bed.currentOccupant}) extended by +24h to ${fmtDate(nextVacating)} due to road delay.`);
  };

  // Quick Action 1: Check-In Inbound (🔴 Occupied)
  const executeCheckIn = (bed, incomingWorker, vacatingDate) => {
    const defaultWorker = bed.nextOccupant && bed.nextOccupant !== 'None' 
      ? bed.nextOccupant.replace(/\s*\(In Transit\)/i, '') 
      : 'Inbound Technician';
    const worker = incomingWorker || defaultWorker;
    const vacating = vacatingDate || addDays(todayISO(), 14);
    mutate('campBeds', 'update', {
      ...bed,
      currentOccupant: worker,
      shiftStatus: 'Mid-Roster (Active)',
      vacatingDate: vacating,
      nextOccupant: 'None',
      status: 'Occupied',
      roadDelayExt: false,
      notes: (bed.notes ? bed.notes + ' | ' : '') + `Checked in on ${fmtDate(todayISO())}`
    });
  };

  // Quick Action 2: Send to Housekeeping (🔵 Housekeeping)
  const executeSendToHousekeeping = (bed) => {
    mutate('campBeds', 'update', {
      ...bed,
      currentOccupant: 'Vacant',
      shiftStatus: 'Maintenance / Cleaning',
      vacatingDate: null,
      status: 'Housekeeping',
      roadDelayExt: false,
      notes: 'Departed site; queued for linen change & sanitation'
    });
  };

  // Quick Action 3: Sanitation Cleared (🟢 Available)
  const executeSanitationCleared = (bed) => {
    mutate('campBeds', 'update', {
      ...bed,
      currentOccupant: 'Vacant',
      shiftStatus: 'Ready for Assignment',
      vacatingDate: null,
      status: 'Available',
      roadDelayExt: false,
      notes: 'Sanitized & inspected — ready for check-in'
    });
  };

  // Open Quick Entry Modal
  const openQuickEntryModal = (bed = null, defaultAction = 'checkin') => {
    const targetBed = bed || beds[0] || {};
    setQuickModal({ bed: targetBed, isNew: !bed });
    setQuickForm({
      bedId: targetBed.bedId || '',
      roomId: targetBed.roomId || 'MH-A',
      currentOccupant: targetBed.nextOccupant && targetBed.nextOccupant !== 'None' 
        ? targetBed.nextOccupant.replace(/\s*\(In Transit\)/i, '') 
        : (targetBed.currentOccupant === 'Vacant' ? '' : targetBed.currentOccupant || ''),
      shiftStatus: targetBed.shiftStatus || 'Mid-Roster (Active)',
      vacatingDate: targetBed.vacatingDate || addDays(todayISO(), 14),
      nextOccupant: targetBed.nextOccupant || 'None',
      status: defaultAction === 'checkin' ? 'Occupied' : defaultAction === 'housekeeping' ? 'Housekeeping' : defaultAction === 'sanitize' ? 'Available' : (targetBed.status || 'Occupied'),
      notes: targetBed.notes || '',
      actionType: defaultAction,
      selectedBedId: targetBed.id || (beds[0] ? beds[0].id : '')
    });
  };

  const handleModalSubmit = (e) => {
    e.preventDefault();
    if(!quickModal) return;

    if(quickModal.isNew){
      const newRecord = {
        roomId: quickForm.roomId || (quickForm.bedId.includes('-') ? quickForm.bedId.split('-').slice(0,2).join('-') : 'MH-A'),
        bedId: quickForm.bedId,
        currentOccupant: quickForm.currentOccupant || 'Vacant',
        shiftStatus: quickForm.shiftStatus,
        vacatingDate: quickForm.vacatingDate || null,
        nextOccupant: quickForm.nextOccupant || 'None',
        status: quickForm.status,
        roadDelayExt: false,
        notes: quickForm.notes || ''
      };
      mutate('campBeds', 'insert', newRecord);
    } else if(quickForm.actionType === 'checkin') {
      const selected = beds.find(b => b.id === quickForm.selectedBedId) || quickModal.bed;
      executeCheckIn(selected, quickForm.currentOccupant, quickForm.vacatingDate);
    } else if(quickForm.actionType === 'housekeeping') {
      const selected = beds.find(b => b.id === quickForm.selectedBedId) || quickModal.bed;
      executeSendToHousekeeping(selected);
    } else if(quickForm.actionType === 'sanitize') {
      const selected = beds.find(b => b.id === quickForm.selectedBedId) || quickModal.bed;
      executeSanitationCleared(selected);
    } else {
      // Manual full edit
      const selected = beds.find(b => b.id === quickForm.selectedBedId) || quickModal.bed;
      mutate('campBeds', 'update', {
        ...selected,
        bedId: quickForm.bedId || selected.bedId,
        roomId: quickForm.roomId || selected.roomId,
        currentOccupant: quickForm.currentOccupant || 'Vacant',
        shiftStatus: quickForm.shiftStatus,
        vacatingDate: quickForm.vacatingDate || null,
        nextOccupant: quickForm.nextOccupant || 'None',
        status: quickForm.status,
        notes: quickForm.notes
      });
    }
    setQuickModal(null);
  };

  const filteredBeds = beds.filter(b => {
    if(filterStatus !== 'ALL' && b.status !== filterStatus) return false;
    if(searchTerm){
      const term = searchTerm.toLowerCase();
      const matchBed = (b.bedId || '').toLowerCase().includes(term);
      const matchOcc = (b.currentOccupant || '').toLowerCase().includes(term);
      const matchNext = (b.nextOccupant || '').toLowerCase().includes(term);
      const matchShift = (b.shiftStatus || '').toLowerCase().includes(term);
      return matchBed || matchOcc || matchNext || matchShift;
    }
    return true;
  });

  return (
    <div>
      {/* Road Delay Safety Status Banner */}
      <div className="delay-banner">
        <div>
          <div className="delay-banner-title">
            <span>🛡️ ROAD DELAY SAFETY ENGINE</span>
            {delayedCount > 0 ? (
              <span className="badge delay-ext">⚠️ {delayedCount} Convoy Delay Extension Active</span>
            ) : (
              <span className="badge" style={{background:'#233A2C', color:'#8FCB9F'}}>Nominal Transport Corridor</span>
            )}
          </div>
          <div className="delay-banner-sub">
            {safetyBannerMsg || "Automated +24h vacating extension protects outbound workers from being unhoused if convoys encounter muddy roads or weather holds."}
          </div>
        </div>
        <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
          {delayedCount === 0 ? (
            <button className="btn sm" style={{background:'var(--rust)', color:'#fff'}} onClick={handleTriggerGlobalRoadDelay}>
              🌧️ Simulate Road Delay (+24h All Outbound)
            </button>
          ) : (
            <button className="btn secondary sm" onClick={handleClearGlobalRoadDelay}>
              ☀️ Clear Road Delay & Restore Normal Rotations
            </button>
          )}
        </div>
      </div>

      {/* KPI Cards for Camp Bed Turnover */}
      <div className="kpi-row" style={{marginBottom:18}}>
        <div className="kpi-card clickable" style={{padding:'12px 14px', borderTopColor:'#C4432B'}} onClick={()=>setFilterStatus('Occupied')}>
          <div className="kpi-label">🔴 Occupied Beds</div>
          <div className="kpi-value" style={{fontSize:22, color:'#E8A38F'}}>{occupiedCount}</div>
          <div className="kpi-foot">Locked by active worker</div>
        </div>
        <div className="kpi-card clickable" style={{padding:'12px 14px', borderTopColor:'var(--amber)'}} onClick={()=>setFilterStatus('Pending Handover')}>
          <div className="kpi-label">🟡 Pending Handover</div>
          <div className="kpi-value" style={{fontSize:22, color:'#E8C285'}}>{pendingCount}</div>
          <div className="kpi-foot">High-risk! Outgoing leaves today</div>
        </div>
        <div className="kpi-card clickable" style={{padding:'12px 14px', borderTopColor:'var(--steel)'}} onClick={()=>setFilterStatus('Housekeeping')}>
          <div className="kpi-label">🔵 Housekeeping</div>
          <div className="kpi-value" style={{fontSize:22, color:'#9DBBE0'}}>{housekeepingCount}</div>
          <div className="kpi-foot">Requires cleaning before check-in</div>
        </div>
        <div className="kpi-card ok clickable" style={{padding:'12px 14px'}} onClick={()=>setFilterStatus('Available')}>
          <div className="kpi-label">🟢 Available Beds</div>
          <div className="kpi-value" style={{fontSize:22, color:'#8FCB9F'}}>{availableCount}</div>
          <div className="kpi-foot">Ready for immediate assignment</div>
        </div>
      </div>

      {/* Main Panel with Filter, Search, and Action Bar */}
      <div className="panel">
        <div className="panel-head" style={{flexWrap:'wrap', gap:12}}>
          <div>
            <div className="panel-title">Camp Bed Matrix & Accommodation Allocation</div>
            <div className="panel-sub">
              Physical room allocation, shift turnover status, and anti-hot-bedding control ({beds.length} Total Beds)
            </div>
          </div>
          <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
            <button className="btn" onClick={()=>openQuickEntryModal(null, 'checkin')}>
              + Assign / Update Bed
            </button>
            <button className="btn secondary" onClick={()=>openQuickEntryModal(null, 'manual')}>
              + Add New Bed
            </button>
          </div>
        </div>

        {/* Filter Pills and Search */}
        <div className="filter-bar">
          <button className={"filter-chip " + (filterStatus==='ALL'?'active':'')} onClick={()=>setFilterStatus('ALL')}>
            All Beds ({beds.length})
          </button>
          <button className={"filter-chip " + (filterStatus==='Occupied'?'active':'')} onClick={()=>setFilterStatus('Occupied')}>
            🔴 Occupied ({occupiedCount})
          </button>
          <button className={"filter-chip " + (filterStatus==='Pending Handover'?'active':'')} onClick={()=>setFilterStatus('Pending Handover')}>
            🟡 Pending Handover ({pendingCount})
          </button>
          <button className={"filter-chip " + (filterStatus==='Housekeeping'?'active':'')} onClick={()=>setFilterStatus('Housekeeping')}>
            🔵 Housekeeping ({housekeepingCount})
          </button>
          <button className={"filter-chip " + (filterStatus==='Available'?'active':'')} onClick={()=>setFilterStatus('Available')}>
            🟢 Available ({availableCount})
          </button>

          <div style={{marginLeft:'auto', display:'flex', alignItems:'center', gap:8}}>
            <input
              type="text"
              placeholder="Search Bed or Occupant…"
              value={searchTerm}
              onChange={e=>setSearchTerm(e.target.value)}
              style={{
                background:'var(--bg)', border:'1px solid var(--border)', color:'var(--text)',
                padding:'5px 10px', borderRadius:6, fontSize:12, fontFamily:'var(--body)', width:180
              }}
            />
            {searchTerm && (
              <button className="icon-btn" onClick={()=>setSearchTerm('')} title="Clear Search">✕</button>
            )}
          </div>
        </div>

        {/* Data Grid Layout */}
        {filteredBeds.length === 0 ? (
          <div className="empty-state">No camp beds match the selected filter.</div>
        ) : (
          <div className="table-scroll">
            <table>
              <thead>
                <tr>
                  <th style={{width:130}}>ROOM / BED ID</th>
                  <th>CURRENT OCCUPANT</th>
                  <th>SHIFT ROTATION STATUS</th>
                  <th>VACATING DATE</th>
                  <th>NEXT RESERVED OCCUPANT</th>
                  <th>BED STATUS</th>
                  <th style={{textAlign:'right'}}>QUICK ACTIONS</th>
                </tr>
              </thead>
              <tbody>
                {filteredBeds.map(bed => {
                  const isPending = bed.status === 'Pending Handover';
                  const isOccupied = bed.status === 'Occupied';
                  const isCleaning = bed.status === 'Housekeeping';
                  const isAvail = bed.status === 'Available';

                  return (
                    <tr key={bed.id} className={bed._pending ? 'row-pending' : ''}>
                      {/* 1. ROOM / BED ID */}
                      <td className="num" style={{fontWeight:700, color:'var(--text)', fontSize:13}}>
                        <b>{bed.bedId}</b>
                      </td>

                      {/* 2. CURRENT OCCUPANT */}
                      <td>
                        {bed.currentOccupant === 'Vacant' || !bed.currentOccupant ? (
                          <span style={{color:'var(--text-dim)', fontStyle:'italic'}}>Vacant</span>
